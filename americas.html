<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Sixty Works of Art from the Americas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/6.1.1/openseadragon.min.js"></script>
<style>
:root {
  --bg: #14110e;
  --panel: #1d1915;
  --ink: #ece4d6;
  --muted: #a89c88;
  --line: #3a3229;
  --gold: #c9a45c;
  --serif: "Cormorant Garamond", Georgia, serif;
  --sans: "Inter", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
a { color: var(--gold); }

header { max-width: 1400px; margin: 0 auto; padding: 48px 24px 16px; }
h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(2.2rem, 5vw, 3.6rem); margin: 0 0 20px; letter-spacing: .01em; }
.rooms { font: 500 .8rem var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; }
.rooms a { color: var(--muted); text-decoration: none; }
.rooms a:hover { color: var(--gold); }
.rooms span { color: var(--gold); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters button {
  font: 500 .85rem var(--sans); color: var(--muted); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; cursor: pointer;
}
.filters button[aria-pressed="true"] { color: var(--bg); background: var(--ink); border-color: var(--ink); }

/* Justified rows: each card's width follows its painting's aspect ratio (--ar) */
main { max-width: 1400px; margin: 0 auto; padding: 16px 24px 80px; display: flex; flex-wrap: wrap; gap: 30px 18px; --row: 250px; }
main::after { content: ""; flex-grow: 1000000; }
.card {
  flex-grow: calc(var(--ar) * 100); flex-basis: calc(var(--ar) * var(--row)); min-width: 0;
  cursor: pointer; display: block;
  background: none; border: 0; padding: 0; text-align: left; color: inherit; font: inherit;
}
.card img { aspect-ratio: var(--ar); object-fit: cover; }
.card .frame { position: relative; background: #0c0a08; overflow: hidden; }
.card img { display: block; width: 100%; height: auto; transition: transform .5s ease, opacity .4s; }
.card:hover img, .card:focus-visible img { transform: scale(1.025); }
.card .num { position: absolute; top: 8px; left: 8px; font: 500 .72rem var(--sans); background: rgba(0,0,0,.6); color: var(--ink); padding: 3px 7px; border-radius: 3px; }
.card h2 { font-family: var(--serif); font-weight: 600; font-size: 1.3rem; margin: 10px 0 2px; line-height: 1.2; }
.card p { margin: 0; color: var(--muted); font-size: .85rem; }
.card[hidden] { display: none; }

/* Viewer */
#viewer { position: fixed; inset: 0; z-index: 10; background: #0a0908; display: none; grid-template-columns: 1fr 380px; }
#viewer.open { display: grid; }
#stage { position: relative; min-height: 0; }
#osd { position: absolute; inset: 0; }
#loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: var(--muted); font-size: .9rem; pointer-events: none; }
.tools { position: absolute; right: 16px; bottom: 16px; display: flex; gap: 6px; z-index: 2; }
.tools button, .nav button, #close {
  font: 500 1.1rem var(--sans); width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
  background: rgba(20,17,14,.8); color: var(--ink); border: 1px solid var(--line);
}
.tools button:hover, .nav button:hover, #close:hover { border-color: var(--gold); }
.nav { position: absolute; top: 50%; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 12px; pointer-events: none; z-index: 2; }
.nav button { pointer-events: auto; }
#close { position: absolute; top: 16px; right: 16px; z-index: 3; }

aside { background: var(--panel); border-left: 1px solid var(--line); padding: 40px 28px; overflow-y: auto; }
aside .count { color: var(--muted); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 14px; }
aside h2 { font-family: var(--serif); font-weight: 600; font-size: 2rem; line-height: 1.1; margin: 0 0 8px; }
aside .artist { font-family: var(--serif); font-style: italic; font-size: 1.25rem; margin: 0 0 4px; }
aside .zh, aside .ja, aside .ko { font-family: "Noto Serif TC", "Songti TC", serif; font-style: normal; color: var(--muted); font-size: 1.05rem; margin: 0 0 8px; }
aside .ja { font-family: "Hiragino Mincho ProN", "Noto Serif JP", "Yu Mincho", serif; }
aside .ko { font-family: "AppleMyungjo", "Noto Serif KR", "Batang", serif; }
aside .orig { font-family: "Amiri", "Geeza Pro", "Noto Naskh Arabic", serif; font-style: normal; color: var(--muted); font-size: 1.15rem; margin: 0 0 8px; }
aside .orig.tr { font-family: inherit; font-style: italic; font-size: 1rem; }
aside .orig.sa, aside .orig.hi, aside .orig.ne, aside .orig.bn, aside .orig.ta, aside .orig.si, aside .orig.bo, aside .orig.ml { font-family: "Kohinoor Devanagari", "Noto Serif Devanagari", "Tamil Sangam MN", "Bangla Sangam MN", "Sinhala Sangam MN", "Malayalam Sangam MN", "Kailasa", serif; font-size: 1.05rem; }
aside .orig.vi, aside .orig.id, aside .orig.ban, aside .orig.jv, aside .orig.tl { font-family: inherit; font-style: italic; font-size: 1rem; }
aside .orig.am, aside .orig.gez { font-family: "Kefa", "Noto Sans Ethiopic", "Noto Serif Ethiopic", serif; font-size: 1.05rem; }
aside .orig.yo, aside .orig.sw, aside .orig.mg, aside .orig.zu, aside .orig.kg, aside .orig.ha, aside .orig.tw, aside .orig.ber, aside .orig.bax, aside .orig.bin, aside .orig.bm, aside .orig.fan, aside .orig.lu, aside .orig.lua, aside .orig.men, aside .orig.naq, aside .orig.es, aside .orig.pt, aside .orig.nah, aside .orig.yua, aside .orig.qu, aside .orig.tli, aside .orig.hai, aside .orig.kwk, aside .orig.nv, aside .orig.lkt, aside .orig.kio { font-family: inherit; font-style: italic; font-size: 1rem; }
aside .orig.th, aside .orig.lo, aside .orig.km, aside .orig.my { font-family: "Thonburi", "Lao Sangam MN", "Khmer Sangam MN", "Myanmar Sangam MN", "Noto Sans Thai", "Noto Sans Lao", "Noto Sans Khmer", "Noto Sans Myanmar", serif; font-size: 1.05rem; }
aside .scrollnote { color: var(--gold); font-size: .85rem; margin: 0 0 20px; }
aside .meta { color: var(--muted); font-size: .85rem; margin: 0 0 24px; line-height: 1.5; }
aside .desc { font-size: .98rem; line-height: 1.65; margin: 0 0 20px; }
aside .look { border-left: 2px solid var(--gold); padding: 2px 0 2px 14px; font-size: .95rem; line-height: 1.6; margin: 0 0 28px; }
aside .look b { display: block; color: var(--gold); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; }
aside .links { display: flex; flex-direction: column; gap: 8px; font-size: .88rem; }
aside .hint { color: var(--muted); font-size: .78rem; margin-top: 28px; line-height: 1.5; }
aside .credit { color: var(--muted); font-size: .78rem; margin-top: 10px; line-height: 1.5; }

@media (max-width: 800px) {
  header { padding: 32px 16px 12px; }
  main { padding: 12px 16px 60px; gap: 22px 12px; --row: 130px; }
  #viewer { grid-template-columns: 1fr; grid-template-rows: 58vh 1fr; }
  aside { border-left: 0; border-top: 1px solid var(--line); padding: 22px 16px 40px; }
  aside h2 { font-size: 1.6rem; }
  .hint { display: none; }
}
/* Painting-only mode: panel hidden, painting fills the screen */
#viewer.open.bare { grid-template-columns: 1fr; grid-template-rows: 1fr; }
#viewer.bare aside { display: none; }
.tools button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.tools, .nav, #close { transition: opacity .4s; }
#viewer.idle .tools, #viewer.idle .nav, #viewer.idle #close { opacity: 0; pointer-events: none; }
#viewer.idle { cursor: none; }
#viewer.idle .navigator { opacity: 0 !important; transition: opacity .4s; }
</style>
</head>

<script>
const DATA = [{"region": "First cities and carvers", "title": "San Lorenzo Colossal Head 1", "artist": "Unknown Olmec sculptor, San Lorenzo", "date": "About 1200–900 BCE", "location": "Museo de Antropología de Xalapa, Xalapa", "desc": "This giant head was carved by the Olmec at San Lorenzo, in what is now Veracruz, the first great Olmec center on the Gulf Coast of Mexico. It is one of seventeen colossal heads known today, and it stands more than two and a half meters tall. The sculptors hauled the basalt boulder from the Tuxtla Mountains, many kilometers away, and shaped it with harder stones. Most scholars read the heads as portraits of rulers, each with his own face and his own headdress. The American archaeologist Matthew Stirling dug out this head at San Lorenzo in 1946, and it now stands in the museum at Xalapa.", "look": "Look at the thick band around the head, like a helmet, with a carved ornament above the forehead. It may have told people who this ruler was. Then look at the face: the heavy lids, the wide nose and the full lips were cut into hard stone with other stones.", "medium": "Basalt", "credit": "Photo: Chrisi1964, CC BY-SA 4.0", "levels": [{"url": "crops/unknown_olmec_sculptor_san_lorenzo_san_lorenzo_colossal_head_960.jpg", "width": 960, "height": 1234}, {"url": "crops/unknown_olmec_sculptor_san_lorenzo_san_lorenzo_colossal_head_1920.jpg", "width": 1920, "height": 2468}, {"url": "crops/unknown_olmec_sculptor_san_lorenzo_san_lorenzo_colossal_head_3516.jpg", "width": 3516, "height": 4520}], "wiki": "https://en.wikipedia.org/wiki/San_Lorenzo_Colossal_Head_1", "commons": "https://commons.wikimedia.org/wiki/File:Olmekischer_Kolossalkopf_Museum_Jalapa_1.jpg"}, {"region": "First cities and carvers", "title": "Las Limas Monument 1", "artist": "Unknown Olmec sculptor", "date": "About 1000–600 BCE", "location": "Museo de Antropología de Xalapa, Xalapa", "desc": "This Olmec greenstone figure shows a young person sitting cross-legged with a baby lying across the lap. The baby is a were-jaguar, a being that is part human infant and part jaguar, one of the most important figures in Olmec belief. Fine lines cut into the shoulders and knees show the faces of other sacred beings in profile, so the figure carries a small collection of gods on its body. Two children found it in 1965 near the village of Las Limas in southern Veracruz, and it is often called the Señor de Las Limas, the Lord of Las Limas. It is about half a meter tall. Scholars still use its incised faces to sort out the gods of the Olmec world.", "look": "Look at the baby lying limp across the lap, held up by two big hands. Then look closely at the knees for the faint scratched lines: each one makes the face of a different sacred being, and there are more on the shoulders.", "medium": "Serpentine", "credit": "Photo: ProtoplasmaKid, CC BY-SA 4.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e8/Se%C3%B1or_de_Las_Limas_%28cropped%29.jpg/960px-Se%C3%B1or_de_Las_Limas_%28cropped%29.jpg", "width": 960, "height": 1293}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e8/Se%C3%B1or_de_Las_Limas_%28cropped%29.jpg/1920px-Se%C3%B1or_de_Las_Limas_%28cropped%29.jpg", "width": 1920, "height": 2586}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e8/Se%C3%B1or_de_Las_Limas_%28cropped%29.jpg/3840px-Se%C3%B1or_de_Las_Limas_%28cropped%29.jpg", "width": 3840, "height": 5171}], "wiki": "https://en.wikipedia.org/wiki/Las_Limas_Monument_1", "commons": "https://commons.wikimedia.org/wiki/File:Se%C3%B1or_de_Las_Limas_(cropped).jpg"}, {"region": "First cities and carvers", "title": "Tenon head on the Castillo, Chavín de Huántar", "artist": "Unknown Chavín sculptor", "date": "About 900–200 BCE", "location": "Chavín de Huántar, Áncash, Peru", "desc": "This is a photograph of a carved stone head still set in the wall of the main temple at Chavín de Huántar, high in the Andes of northern Peru. Chavín was a great religious center, and pilgrims came to it from far along the coast and the mountains. Heads like this one, called cabezas clavas or tenon heads, stuck out in a row high on the outer walls. The long back of each stone, the tenon, was pushed deep into the masonry to hold it. Many of the heads show a face turning from human into a fierce animal, which scholars link to priests changing form during rituals. This is the only one still in its original place. About a hundred others are kept in the Museo Nacional de Chavín, close to the site.", "look": "See how the head pokes out of the wall of flat stones, with its long hidden back gripped by the blocks around it. Then find the big round eye, the wide nose and the curling lines on the cheek, lines that make the face look part human and part animal.", "title_orig": "Cabeza clava", "lang_orig": "es", "medium": "Carved stone, set in the temple wall (photograph)", "credit": "Photo: Dtarazona, CC BY-SA 3.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a6/Cabeza_clava_en_lugar_original_vista_2_06122009.jpg/960px-Cabeza_clava_en_lugar_original_vista_2_06122009.jpg", "width": 960, "height": 720}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a6/Cabeza_clava_en_lugar_original_vista_2_06122009.jpg/1920px-Cabeza_clava_en_lugar_original_vista_2_06122009.jpg", "width": 1920, "height": 1440}, {"url": "https://upload.wikimedia.org/wikipedia/commons/a/a6/Cabeza_clava_en_lugar_original_vista_2_06122009.jpg", "width": 3072, "height": 2304}], "wiki": "https://en.wikipedia.org/wiki/Chav%C3%ADn_de_Hu%C3%A1ntar", "commons": "https://commons.wikimedia.org/wiki/File:Cabeza_clava_en_lugar_original_vista_2_06122009.jpg"}, {"region": "First cities and carvers", "title": "Serpent Mound", "artist": "Unknown Native American builders of the Ohio Valley", "date": "About 300 BCE or about 1070 CE (dates debated)", "location": "Serpent Mound, near Peebles, Adams County, Ohio", "desc": "This is a photograph of Serpent Mound in southern Ohio, the largest known earthwork in the shape of an animal. Native American builders heaped up a low bank of earth about 400 meters long that winds along a ridge above Brush Creek like a snake, with a coiled tail at one end and an open mouth at the other. No one was buried in the serpent itself, though graves lie in smaller mounds nearby, and most people read it as a sacred place. Who built it is still debated. Some radiocarbon dates point to the Adena people around 300 BCE, and others to the Fort Ancient people around 1070 CE. Many people think the head points toward the sunset on the longest day of the year. In the 1880s the Harvard archaeologist Frederic Putnam dug into the burial mounds nearby, removing human remains that Harvard's Peabody Museum still partly holds, and raised money for Harvard to buy the land and save the mound from the plow. Harvard came to own it decades after the US government forced the Shawnee and other nations out of Ohio in the 1830s, and Shawnee leaders now come back from Oklahoma to speak for this ancestral site.", "look": "Start with the round, curling humps in the front: that is the serpent's coiled tail. Then follow the long green ridge as it bends back and forth into the trees. The head is far away on the right, too far to see clearly from here.", "medium": "Earth mound (photograph)", "credit": "Photo: Eric Ewing, CC BY-SA 3.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/51/The_Great_Serpent_Mound.jpg/960px-The_Great_Serpent_Mound.jpg", "width": 960, "height": 410}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/51/The_Great_Serpent_Mound.jpg/1920px-The_Great_Serpent_Mound.jpg", "width": 1920, "height": 819}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/51/The_Great_Serpent_Mound.jpg/3840px-The_Great_Serpent_Mound.jpg", "width": 3840, "height": 1639}], "wiki": "https://en.wikipedia.org/wiki/Serpent_Mound", "commons": "https://commons.wikimedia.org/wiki/File:The_Great_Serpent_Mound.jpg"}, {"region": "First cities and carvers", "title": "Ceremonial mantle", "artist": "Unknown Paracas embroiderers, south coast of Peru", "date": "100 BCE–100 CE", "location": "Museo de Arte de Lima (MALI), Lima", "desc": "This mantle was made by Paracas embroiderers on the south coast of Peru about two thousand years ago. It is almost three meters long. The makers wove a plain cotton cloth and then stitched every figure onto it with dyed thread spun from camelid wool, the hair of the llama family. Cloth was the most valued art in the ancient Andes, and the finest mantles were made for the dead. This one was a funeral offering. It likely came from a burial bundle on the Paracas peninsula, where the dry desert kept the colors bright, but where and by whom it was dug up is not recorded. The same figure appears 74 times: a man in ceremonial dress who holds a trophy head, the sign of a winner in ritual combat. The shape stays the same, but the colors change, and each row walks the opposite way to the next. It came to the Museo de Arte de Lima with the Memoria Prado, the collection Javier Prado Ugarteche gathered in the early 1900s, and the museum says those objects lack a record of where they were found.", "look": "Pick one figure with its crown of feathers and count how many others share its colors. Find the striped staff in one hand and the small round head hanging from the other. Then follow the orange border and see that the figures along the top and bottom lie on their sides.", "title_orig": "Manto ceremonial", "lang_orig": "es", "medium": "Cotton plain weave, embroidered with camelid fiber", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/26/Paracas_style_-_Ceremonial_mantle_-_Google_Art_Project.jpg/960px-Paracas_style_-_Ceremonial_mantle_-_Google_Art_Project.jpg", "width": 960, "height": 501}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/26/Paracas_style_-_Ceremonial_mantle_-_Google_Art_Project.jpg/1920px-Paracas_style_-_Ceremonial_mantle_-_Google_Art_Project.jpg", "width": 1920, "height": 1003}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/26/Paracas_style_-_Ceremonial_mantle_-_Google_Art_Project.jpg/3840px-Paracas_style_-_Ceremonial_mantle_-_Google_Art_Project.jpg", "width": 3840, "height": 2005}], "wiki": "https://en.wikipedia.org/wiki/Paracas_textile", "commons": "https://commons.wikimedia.org/wiki/File:Paracas_style_-_Ceremonial_mantle_-_Google_Art_Project.jpg"}, {"region": "First cities and carvers", "title": "Nazca Lines: the Hummingbird", "artist": "Unknown Nasca makers", "date": "About 500 BCE–500 CE", "location": "Nazca Desert, Ica, Peru", "desc": "This is an aerial photograph of the Hummingbird, one of the great figures the Nasca people drew on the desert floor of southern Peru. The makers moved aside the dark stones on the surface to show the paler ground underneath, and the dry, still climate has kept the lines for many centuries. The bird is about as long as a football field. It is drawn with one unbroken line, so a person could walk the whole figure from start to finish without crossing a path. Scholars link the lines to rituals, perhaps for water in one of the driest places on earth or for watching the sky, and their exact meaning is still debated. The Nasca painted the same animals on their pottery. The lines have been a UNESCO World Heritage Site since 1994.", "look": "Start at the tip of the very long beak on the left and follow the pale line with your finger: up and down through each wing feather, around the tail and back. It never stops. Then spot the straight lines that cross the desert near the bird.", "medium": "Geoglyph, cleared desert surface (photograph)", "credit": "Photo: Diego Delso, CC BY-SA 4.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a5/L%C3%ADneas_de_Nazca%2C_Nazca%2C_Per%C3%BA%2C_2015-07-29%2C_DD_52.JPG/960px-L%C3%ADneas_de_Nazca%2C_Nazca%2C_Per%C3%BA%2C_2015-07-29%2C_DD_52.JPG", "width": 960, "height": 583}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a5/L%C3%ADneas_de_Nazca%2C_Nazca%2C_Per%C3%BA%2C_2015-07-29%2C_DD_52.JPG/1920px-L%C3%ADneas_de_Nazca%2C_Nazca%2C_Per%C3%BA%2C_2015-07-29%2C_DD_52.JPG", "width": 1920, "height": 1165}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a5/L%C3%ADneas_de_Nazca%2C_Nazca%2C_Per%C3%BA%2C_2015-07-29%2C_DD_52.JPG/3840px-L%C3%ADneas_de_Nazca%2C_Nazca%2C_Per%C3%BA%2C_2015-07-29%2C_DD_52.JPG", "width": 3840, "height": 2330}], "wiki": "https://en.wikipedia.org/wiki/Nazca_Lines", "commons": "https://commons.wikimedia.org/wiki/File:L%C3%ADneas_de_Nazca,_Nazca,_Per%C3%BA,_2015-07-29,_DD_52.JPG"}, {"region": "Teotihuacan, Monte Albán and the Maya", "title": "Temple of the Feathered Serpent, Teotihuacan", "artist": "Unknown Teotihuacan builders and sculptors", "date": "About 200–250", "location": "La Ciudadela, Teotihuacan, State of Mexico", "desc": "This is a photograph of the Temple of the Feathered Serpent in Teotihuacan, the largest city in the Americas in its time. The pyramid stands inside the Ciudadela, a vast walled plaza at the center of the city, and was built around 200 to 250. Its stepped sides were covered with carved stone heads of a serpent with a collar of feathers, set between heads of a second creature with round eyes. The stones were once painted in strong colors. About a century later, around 350, the people of the city built a new platform against the front and hid most of the carving, which is why this part survives so well. The Mexica, who came much later, gave the ruined city its Nahuatl name. They worshipped a feathered serpent god called Quetzalcoatl, and the temple is often called by his name today.", "look": "Find the serpent heads with open jaws and sharp teeth, each ringed by a frill of feathers like a flower. Next to each one is a flatter head with two big round rings for eyes. Then look up the stairway: more serpent heads stick out along its edge.", "title_orig": "Pirámide de la Serpiente Emplumada", "lang_orig": "es", "medium": "Cut stone, once painted (photograph)", "credit": "Photo: Thomas Ledl, CC BY-SA 4.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f2/Teotihuac%C3%A1n_La_Ciudadela_Templo_Quetzalcoatl.jpg/960px-Teotihuac%C3%A1n_La_Ciudadela_Templo_Quetzalcoatl.jpg", "width": 960, "height": 561}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f2/Teotihuac%C3%A1n_La_Ciudadela_Templo_Quetzalcoatl.jpg/1920px-Teotihuac%C3%A1n_La_Ciudadela_Templo_Quetzalcoatl.jpg", "width": 1920, "height": 1122}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f2/Teotihuac%C3%A1n_La_Ciudadela_Templo_Quetzalcoatl.jpg/3840px-Teotihuac%C3%A1n_La_Ciudadela_Templo_Quetzalcoatl.jpg", "width": 3840, "height": 2245}], "wiki": "https://en.wikipedia.org/wiki/Temple_of_the_Feathered_Serpent%2C_Teotihuacan", "commons": "https://commons.wikimedia.org/wiki/File:Teotihuac%C3%A1n_La_Ciudadela_Templo_Quetzalcoatl.jpg"}, {"region": "Teotihuacan, Monte Albán and the Maya", "title": "Urn Figure", "artist": "Unknown Zapotec potter of the Valley of Oaxaca", "date": "About 200–500", "location": "Cleveland Museum of Art", "desc": "This seated figure was made by a Zapotec potter in the Valley of Oaxaca in southern Mexico, in the centuries when the hilltop city of Monte Albán ruled the valley. It is modeled in clay on the front of a hollow cylinder. Such works are called urns, but they did not hold the ashes of the dead and are usually found empty. They were set in tombs, and the museum thinks this smaller one kept company with a larger, more complex urn in the same burial. It was made for the dead. The figure wears a mask over the mouth that may show the fanged upper jaw of a serpent. Zapotec potters built these figures up from many parts, adding ornaments such as earrings and necklaces as separate pieces of clay. Where this urn was found is not recorded. A Los Angeles gallery sold it to James and Florence Gruener in 1973, a year after Mexico had declared archaeological objects the inalienable property of the nation and banned their export. It came to the museum as their gift in 1990.", "look": "Look at the mouth: the lumpy mask over it may be a snake's fangs. Then find the big round earrings, the string of clay beads and the knotted belt, each one pressed on as its own piece of clay. Last, look for the faint red paint left on the tall headdress.", "medium": "Earthenware, traces of paint", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e4/Mexico%2C_Oaxaca%2C_Zapotec_-_Urn_Figure_-_1990.277_-_Cleveland_Museum_of_Art.tif/lossy-page1-960px-Mexico%2C_Oaxaca%2C_Zapotec_-_Urn_Figure_-_1990.277_-_Cleveland_Museum_of_Art.tif.jpg", "width": 960, "height": 1380}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e4/Mexico%2C_Oaxaca%2C_Zapotec_-_Urn_Figure_-_1990.277_-_Cleveland_Museum_of_Art.tif/lossy-page1-1920px-Mexico%2C_Oaxaca%2C_Zapotec_-_Urn_Figure_-_1990.277_-_Cleveland_Museum_of_Art.tif.jpg", "width": 1920, "height": 2759}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e4/Mexico%2C_Oaxaca%2C_Zapotec_-_Urn_Figure_-_1990.277_-_Cleveland_Museum_of_Art.tif/lossy-page1-1920px-Mexico%2C_Oaxaca%2C_Zapotec_-_Urn_Figure_-_1990.277_-_Cleveland_Museum_of_Art.tif.jpg", "width": 3398, "height": 4883}], "wiki": "https://en.wikipedia.org/wiki/Zapotec_civilization", "commons": "https://commons.wikimedia.org/wiki/File:Mexico,_Oaxaca,_Zapotec_-_Urn_Figure_-_1990.277_-_Cleveland_Museum_of_Art.tif"}, {"region": "The Andes before the Inca", "title": "Portrait Head Vessel", "artist": "Unknown Moche potter, north coast of Peru", "date": "About 200–550", "location": "Cleveland Museum of Art, Cleveland", "desc": "The Moche lived in the river valleys of Peru's dry north coast. They were the only people of ancient Peru to make lifelike portraits of real people, most often as clay vessels. A Moche potter shaped this bottle as the head of a real man, with a stirrup-shaped spout rising from the top of his head. The Cleveland Museum of Art says Moche portrait vessels show more than 750 different people, most of them men of high rank, and some probably rulers. The same face often appears on several vessels, sometimes at different ages. The bottles were used in life, and many were later placed in tombs with the dead. The potter painted the vessel with slip, a thin wash of colored clay, in reddish brown and cream. The May Company department store in Cleveland sold it to James and Florence Gruener in 1967, and it came to the museum from their estate in 1990. Where in Peru it was found is not recorded.", "look": "Look at the face as you would a person's: the heavy eyelids, the calm mouth, the big ears. Then find the painted stripes of face paint running down over the eyes and cheeks, and the band of triangles and stepped shapes on his headcloth.", "medium": "Earthenware with colored slips", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ab/Peru%2C_North_Coast%2C_Moche_style_-_Portrait_Head_Vessel_-_1990.227_-_Cleveland_Museum_of_Art.tif/lossy-page1-960px-Peru%2C_North_Coast%2C_Moche_style_-_Portrait_Head_Vessel_-_1990.227_-_Cleveland_Museum_of_Art.tif.jpg", "width": 960, "height": 1201}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ab/Peru%2C_North_Coast%2C_Moche_style_-_Portrait_Head_Vessel_-_1990.227_-_Cleveland_Museum_of_Art.tif/lossy-page1-1920px-Peru%2C_North_Coast%2C_Moche_style_-_Portrait_Head_Vessel_-_1990.227_-_Cleveland_Museum_of_Art.tif.jpg", "width": 1920, "height": 2403}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ab/Peru%2C_North_Coast%2C_Moche_style_-_Portrait_Head_Vessel_-_1990.227_-_Cleveland_Museum_of_Art.tif/lossy-page1-3840px-Peru%2C_North_Coast%2C_Moche_style_-_Portrait_Head_Vessel_-_1990.227_-_Cleveland_Museum_of_Art.tif.jpg", "width": 3840, "height": 4806}], "wiki": "https://en.wikipedia.org/wiki/Moche_portrait_vessel", "commons": "https://commons.wikimedia.org/wiki/File:Peru,_North_Coast,_Moche_style_-_Portrait_Head_Vessel_-_1990.227_-_Cleveland_Museum_of_Art.tif"}, {"region": "North America", "title": "Harpoon counterweight", "artist": "Unknown Old Bering Sea ivory carver, Bering Strait region of Alaska", "date": "About 300–500", "location": "Metropolitan Museum of Art, New York", "desc": "This carved walrus ivory comes from the Old Bering Sea culture, whose people hunted walrus, seals and whales on the coasts and islands of the Bering Strait. They are among the ancestors of today's Yupik and Iñupiat peoples. Pieces with this shape are called winged objects. Many scholars think they were fitted to the back end of a harpoon shaft to balance it as a hunter threw it, though their exact use is still debated. Hunters carved their gear with great care. Images of animal spirits were meant to draw game to the hunter, and helper spirits gave the weapon strength. The ivory darkened to this deep brown over many centuries in the frozen ground. It is only about 19 centimeters wide. Charles and Valerie Diker gave it to the Metropolitan Museum of Art in 2019.", "look": "See how the piece spreads out like a pair of wings from the small block in the middle. On each wing, find the round circles with dots in the center, like eyes, and follow the thin carved lines that curve and swirl around them.", "medium": "Walrus ivory", "levels": [{"url": "crops/unknown_old_bering_sea_ivory_carver_bering_strait_region_of__960.jpg", "width": 960, "height": 619}, {"url": "crops/unknown_old_bering_sea_ivory_carver_bering_strait_region_of__1920.jpg", "width": 1920, "height": 1238}, {"url": "crops/unknown_old_bering_sea_ivory_carver_bering_strait_region_of__3040.jpg", "width": 3040, "height": 1960}], "wiki": "https://en.wikipedia.org/wiki/Old_Bering_Sea", "commons": "https://commons.wikimedia.org/wiki/File:Harpoon_counterweight_MET_DP-15301-002.jpg"}, {"region": "Teotihuacan, Monte Albán and the Maya", "title": "Tlalocan mural, Tepantitla (section)", "artist": "Unknown Teotihuacan painters", "date": "About 500–550", "location": "Palacio de Tepantitla, Teotihuacan, State of Mexico", "desc": "This is a photograph of part of a wall painting in Tepantitla, a large residential compound in Teotihuacan. Teotihuacan painters covered the walls of homes and temples in the city with lime plaster and painted on it in red and other earth colors. Here a mountain sends water down into a stream, and all around it tiny people swim, dance, play games, chase butterflies and carry branches. Curling shapes come out of many mouths, the painters' way of showing speech or song. In 1942 the archaeologist Alfonso Caso called the scene Tlalocan, the paradise of the rain god Tlaloc, and the name stuck. Many scholars now read it as a picture of a fertile, well-watered world under a great goddess, who is painted above this scene and is not shown here. The mural survives on the wall only in sections, and a painted copy is shown in the Teotihuacan hall of the Museo Nacional de Antropología in Mexico City.", "look": "Find the speckled gray-blue mountain, just left of the middle, with water streaming out at its base. Then hunt for the little people: some climb the mountain, some tumble upside down, others hold hands in a row. Look for the curls coming from their mouths. Those curls are songs and words.", "title_orig": "Escena del Tlalocan en Tepantitla", "lang_orig": "es", "medium": "Paint on plaster (photograph)", "credit": "Photo: Mario Yaír TS, CC BY-SA 4.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4c/Fragmento_del_mural_Tlalocan_del_Palacio_de_Tepantitla_en_Teotihuac%C3%A1n.jpg/960px-Fragmento_del_mural_Tlalocan_del_Palacio_de_Tepantitla_en_Teotihuac%C3%A1n.jpg", "width": 960, "height": 640}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4c/Fragmento_del_mural_Tlalocan_del_Palacio_de_Tepantitla_en_Teotihuac%C3%A1n.jpg/1920px-Fragmento_del_mural_Tlalocan_del_Palacio_de_Tepantitla_en_Teotihuac%C3%A1n.jpg", "width": 1920, "height": 1280}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4c/Fragmento_del_mural_Tlalocan_del_Palacio_de_Tepantitla_en_Teotihuac%C3%A1n.jpg/3840px-Fragmento_del_mural_Tlalocan_del_Palacio_de_Tepantitla_en_Teotihuac%C3%A1n.jpg", "width": 3840, "height": 2560}], "wiki": "https://en.wikipedia.org/wiki/Tepantitla", "commons": "https://commons.wikimedia.org/wiki/File:Fragmento_del_mural_Tlalocan_del_Palacio_de_Tepantitla_en_Teotihuac%C3%A1n.jpg"}, {"region": "The Andes before the Inca", "title": "Pair of Ear Ornaments with Winged Runners", "artist": "Unknown Moche goldsmiths and mosaic makers, north coast of Peru", "date": "About 400–700", "location": "Metropolitan Museum of Art, New York", "desc": "These two ear ornaments were made for a Moche lord on the north coast of Peru. Each disc is about 8 centimeters across, and a gold tube at the back passed through a large hole in the earlobe. On each face a Moche artist set a running figure with a bird's head and wings, probably an owl in human form, holding a small bag. The figure is built from tiny cut pieces of turquoise, blue sodalite and shell. Around the edge runs a ring of gold beads. Ritual running, by people or by animals in human form, is one of the scenes most often shown on later Moche pottery, though its full meaning is unknown. Ornaments like these were worn by the highest ranks and buried with them. Where this pair was found is not recorded, which usually means it was dug out of a tomb without any record. The collector Alice K. Bache gave the pair to the Metropolitan Museum of Art, part as a gift in 1966 and part as a bequest in 1977.", "look": "Find the bird-headed runner on each disc, legs stretched in a big stride, one hand holding out a small bag. Every color is a separate little piece of stone or shell fitted in by hand. On the right-hand ornament, find the gold tube that went through the ear.", "medium": "Gold, turquoise, sodalite, shell", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/57/Ear_Ornament%2C_Winged_Runner_MET_DP-10734-01.jpg/960px-Ear_Ornament%2C_Winged_Runner_MET_DP-10734-01.jpg", "width": 960, "height": 712}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/57/Ear_Ornament%2C_Winged_Runner_MET_DP-10734-01.jpg/1920px-Ear_Ornament%2C_Winged_Runner_MET_DP-10734-01.jpg", "width": 1920, "height": 1425}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/57/Ear_Ornament%2C_Winged_Runner_MET_DP-10734-01.jpg/3840px-Ear_Ornament%2C_Winged_Runner_MET_DP-10734-01.jpg", "width": 3840, "height": 2849}], "wiki": "https://en.wikipedia.org/wiki/Moche_culture", "commons": "https://commons.wikimedia.org/wiki/File:Ear_Ornament,_Winged_Runner_MET_DP-10734-01.jpg"}, {"region": "Teotihuacan, Monte Albán and the Maya", "title": "Stucco head of K'inich Janaab Pakal", "artist": "Unknown Maya sculptor, court of Palenque", "date": "600s", "location": "Museo Nacional de Antropología, Mexico City", "desc": "This head of modeled stucco, a hard plaster made from burnt lime, over a limestone core, comes from the tomb of K'inich Janaab Pakal, who ruled the Maya city of Palenque from 615 until his death in 683. The Mexican archaeologist Alberto Ruz Lhuillier found the hidden tomb deep inside the Temple of the Inscriptions in 1952. This head and a second one lay on the floor at the foot of the great stone sarcophagus, where they had been placed with the dead king. Scholars read the pair as portraits of Pakal. This one shows him as a boy of about 12, the age at which he became king, and the second as a man of about 30. His hair is shaped like the leaves of a maize plant, so he may also appear here as the young Maize God. Its long sloping forehead was a mark of beauty at the Maya court, and the long nose and full lips follow the features of Pakal's other portraits. The head was made for the dead and buried with him, and it is now in Mexico's national museum.", "look": "Follow the line from the top of the forehead all the way down the long nose: it runs almost straight, the shape the Maya court found most beautiful. Then look up at the hair, cut and tied into long strands that sweep up and back like leaves on a corn plant.", "medium": "Stucco over limestone", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f1/Maya_Head_Found_in_Tomb_of_Kinich_Hanab_Pakal%2C_Ruler_of_Palenque%2C_615-683_AD.jpg/960px-Maya_Head_Found_in_Tomb_of_Kinich_Hanab_Pakal%2C_Ruler_of_Palenque%2C_615-683_AD.jpg", "width": 960, "height": 1440}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f1/Maya_Head_Found_in_Tomb_of_Kinich_Hanab_Pakal%2C_Ruler_of_Palenque%2C_615-683_AD.jpg/1920px-Maya_Head_Found_in_Tomb_of_Kinich_Hanab_Pakal%2C_Ruler_of_Palenque%2C_615-683_AD.jpg", "width": 1920, "height": 2880}, {"url": "https://upload.wikimedia.org/wikipedia/commons/f/f1/Maya_Head_Found_in_Tomb_of_Kinich_Hanab_Pakal%2C_Ruler_of_Palenque%2C_615-683_AD.jpg", "width": 3456, "height": 5184}], "wiki": "https://en.wikipedia.org/wiki/K%27inich_Janaab_Pakal_I", "commons": "https://commons.wikimedia.org/wiki/File:Maya_Head_Found_in_Tomb_of_Kinich_Hanab_Pakal,_Ruler_of_Palenque,_615-683_AD.jpg"}, {"region": "Teotihuacan, Monte Albán and the Maya", "title": "Figure of a noblewoman from Jaina", "artist": "Unknown Maya potter of the Campeche coast", "date": "About 600–800", "location": "Museo Arqueológico de Campeche, Fuerte de San Miguel, Campeche", "desc": "This small clay figure comes from Jaina, an island off the coast of Campeche in Mexico. The Maya used the island as a burial ground, and figures like this one were placed in graves with the dead. A Maya potter shaped a woman of high rank in a long cloak, with a tall headdress, round ear ornaments and a necklace of beads. A smaller figure is set in front of her, and she rests her hands on its head. Jaina figures are famous for showing Maya people as they dressed and posed in life, from rulers and warriors to women at work. Many were dug out of the graves by looters and sold abroad in the 1900s. This one stays in Campeche, not far from the island where it was found.", "look": "Look at the woman's tall headdress, her round ear ornaments and her bead necklace: these mark her as a noble. Then find the small figure in front of her, with her two hands resting on top of its head.", "medium": "Ceramic", "credit": "Photo: Bernard DUPONT, CC BY-SA 2.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6d/Ceramic_Figure_of_Noble_Woman_..._Jaina%2C_Late_Classic_%28600-800_AD%29_-_49503469491.jpg/960px-Ceramic_Figure_of_Noble_Woman_..._Jaina%2C_Late_Classic_%28600-800_AD%29_-_49503469491.jpg", "width": 960, "height": 1883}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6d/Ceramic_Figure_of_Noble_Woman_..._Jaina%2C_Late_Classic_%28600-800_AD%29_-_49503469491.jpg/1920px-Ceramic_Figure_of_Noble_Woman_..._Jaina%2C_Late_Classic_%28600-800_AD%29_-_49503469491.jpg", "width": 1920, "height": 3765}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6d/Ceramic_Figure_of_Noble_Woman_..._Jaina%2C_Late_Classic_%28600-800_AD%29_-_49503469491.jpg/1920px-Ceramic_Figure_of_Noble_Woman_..._Jaina%2C_Late_Classic_%28600-800_AD%29_-_49503469491.jpg", "width": 2747, "height": 5387}], "wiki": "https://en.wikipedia.org/wiki/Jaina_Island", "commons": "https://commons.wikimedia.org/wiki/File:Ceramic_Figure_of_Noble_Woman_..._Jaina,_Late_Classic_(600-800_AD)_-_49503469491.jpg"}, {"region": "The Isthmus, the Caribbean and the Amazon", "title": "Pectoral (Chest Plaque)", "artist": "Unknown Coclé goldsmith of central Panama (Conte style)", "date": "About 400–900", "location": "Cleveland Museum of Art, Cleveland", "desc": "This gold plaque was made to be worn on the chest of a ruler in central Panama, and it went with him to his grave. It comes from Sitio Conte, a cemetery beside the Río Grande de Coclé where powerful chiefs were buried with great wealth. Harvard's Peabody Museum dug the site in the 1930s. The plaque lay close to the body of a young chief in Grave 26, who was buried with 475 objects, many of them gold ornaments he wore in life. The goldsmith hammered a sheet of gold thin, then pushed the design up from the back. It shows a creature with a wide mouth full of teeth, reptile claws and perhaps the crest of an iguana. Its meaning is not known, but the Cleveland Museum of Art suggests that, as in later times, the gleam of gold linked rulers with the power of the sun. The Peabody Museum later sold this plaque to a New York dealer, John Wise Ltd., which sold it to the Cleveland Museum of Art in 1952, paid for by Mrs. R. Henry Norweb and Mrs. Albert S. Ingalls with added museum funds.", "look": "Find the big square mouth with its row of teeth at the top, then the two round eyes above it. Now look lower: on each side a second animal head in profile, with its own eye and zigzag teeth. The goldsmith raised every line by pushing the thin gold out from behind.", "medium": "Gold alloy", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/39/Intermediate_Region%2C_Panama%2C_Conte_style%2C_5th-10th_Century_-_Pectoral_%28Chest_Plaque%29_-_1952.459_-_Cleveland_Museum_of_Art.tif/lossy-page1-960px-Intermediate_Region%2C_Panama%2C_Conte_style%2C_5th-10th_Century_-_Pectoral_%28Chest_Plaque%29_-_1952.459_-_Cleveland_Museum_of_Art.tif.jpg", "width": 960, "height": 861}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/39/Intermediate_Region%2C_Panama%2C_Conte_style%2C_5th-10th_Century_-_Pectoral_%28Chest_Plaque%29_-_1952.459_-_Cleveland_Museum_of_Art.tif/lossy-page1-1920px-Intermediate_Region%2C_Panama%2C_Conte_style%2C_5th-10th_Century_-_Pectoral_%28Chest_Plaque%29_-_1952.459_-_Cleveland_Museum_of_Art.tif.jpg", "width": 1920, "height": 1723}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/39/Intermediate_Region%2C_Panama%2C_Conte_style%2C_5th-10th_Century_-_Pectoral_%28Chest_Plaque%29_-_1952.459_-_Cleveland_Museum_of_Art.tif/lossy-page1-3840px-Intermediate_Region%2C_Panama%2C_Conte_style%2C_5th-10th_Century_-_Pectoral_%28Chest_Plaque%29_-_1952.459_-_Cleveland_Museum_of_Art.tif.jpg", "width": 3840, "height": 3446}], "wiki": "https://en.wikipedia.org/wiki/Sitio_Conte", "commons": "https://commons.wikimedia.org/wiki/File:Intermediate_Region,_Panama,_Conte_style,_5th-10th_Century_-_Pectoral_(Chest_Plaque)_-_1952.459_-_Cleveland_Museum_of_Art.tif"}, {"region": "Teotihuacan, Monte Albán and the Maya", "title": "Lintel 24", "artist": "Unknown Maya sculptor of Yaxchilan", "date": "Carved about 725; the rite shown took place on 28 October 709", "location": "British Museum, London", "desc": "This carved stone was set over a doorway of Structure 23, a temple at Yaxchilan, a Maya city on the Usumacinta River, which now forms part of the border between Mexico and Guatemala. The temple honored Lady K'abal Xook, the chief wife of the king Shield Jaguar (Itzamnaaj Bahlam III). The carving shows a bloodletting rite held on 28 October 709. The king holds a flaming torch, and Lady K'abal Xook kneels before him and pulls a rope set with thorns through her tongue. Her blood falls on strips of paper in a basket, which were then burned as an offering, At Yaxchilan's court in the 700s, such bloodletting was believed to summon ancestors and gods and to keep the world in order. The glyphs along the top and side name the two of them and give the date. The British explorer Alfred Maudslay had the lintel cut out of the temple in 1882 and shipped it to London. He wrote: \"this excellent example of Maya art I determined to carry home with me.\" It has never gone back to Yaxchilan.", "look": "Find the king holding up the flaming torch, and his wife kneeling before him, pulling the thorny rope through her tongue. Then look at how the carver filled every space: the pattern woven into her dress, the glyph boxes fitted into the corners, and the basket on the floor with the rope falling into it.", "medium": "Limestone", "credit": "Photo: Mike Peel, CC BY-SA 4.0", "levels": [{"url": "crops/unknown_maya_sculptor_of_yaxchilan_lintel_24_960.jpg", "width": 960, "height": 1330}, {"url": "crops/unknown_maya_sculptor_of_yaxchilan_lintel_24_1920.jpg", "width": 1920, "height": 2661}, {"url": "crops/unknown_maya_sculptor_of_yaxchilan_lintel_24_3796.jpg", "width": 3796, "height": 5261}], "wiki": "https://en.wikipedia.org/wiki/Yaxchilan_Lintel_24", "commons": "https://commons.wikimedia.org/wiki/File:At_the_British_Museum_2024_057.jpg"}, {"region": "Teotihuacan, Monte Albán and the Maya", "title": "Stela H, Copán", "artist": "Unknown Maya sculptors of Copán, for the king Waxaklajuun Ub'aah K'awiil", "date": "730", "location": "Great Plaza, Copán, Honduras", "desc": "This is a photograph of Stela H, a tall carved stone standing in the Great Plaza of Copán, a Maya city in the west of what is now Honduras. It was set up in 730 by Waxaklajuun Ub'aah K'awiil, the thirteenth king of Copán, who filled the plaza with portraits of himself. Here he is dressed as the Maize God, the young god whose death and rebirth made the corn grow, dancing at the creation of the world. His skirt is a net of jade beads, which the Maize God wears, and for a long time outsiders misread the figure as a woman. The sculptors worked in a soft volcanic stone that let them cut very deep, so the carving stands out almost in the round. Eight years later the king was captured and put to death by the ruler of Quiriguá, a city that had been under Copán's rule.", "look": "Find the king's calm face near the top, framed by a huge headdress, and his arms bent across his chest with the hands meeting in the middle. Below them, look for the crisscross net of his skirt, and the reddish color in the deep cuts of the stone, which may be a trace of the red paint that once covered it.", "medium": "Volcanic tuff (photograph)", "credit": "Photo: Dennis G. Jarvis, CC BY-SA 2.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/29/Honduras-0287_%282213597595%29.jpg/960px-Honduras-0287_%282213597595%29.jpg", "width": 960, "height": 1280}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/29/Honduras-0287_%282213597595%29.jpg/1920px-Honduras-0287_%282213597595%29.jpg", "width": 1920, "height": 2560}, {"url": "https://upload.wikimedia.org/wikipedia/commons/2/29/Honduras-0287_%282213597595%29.jpg", "width": 2448, "height": 3264}], "wiki": "https://en.wikipedia.org/wiki/Uaxaclajuun_Ub%27aah_K%27awiil", "commons": "https://commons.wikimedia.org/wiki/File:Honduras-0287_(2213597595).jpg"}, {"region": "Teotihuacan, Monte Albán and the Maya", "title": "Temple I, Tikal", "artist": "Unknown Maya builders of Tikal, for the king Jasaw Chan K'awiil", "date": "Finished about 734", "location": "Tikal, Petén, Guatemala", "desc": "This is a photograph of Temple I at Tikal, one of the great Maya cities, in the rainforest of northern Guatemala. It is the funerary pyramid of Jasaw Chan K'awiil, who ruled Tikal from 682 and defeated its rival Calakmul in 695, after more than a century in which Tikal, defeated in 562, had raised no monuments. He died about 734 and was buried in a vaulted tomb deep under the pyramid. The temple was raised over him and finished after his death. On top stands a small temple of three narrow rooms, crowned by a tall stone roof comb that once carried a carved image of the king. In 1877 Gustav Bernoulli had several of its carved wooden door beams cut out and taken to Basel, and pieces are now in museums in Basel and London. Tikal is a UNESCO World Heritage Site.", "look": "Count the stepped levels as they climb to the small temple at the top, and find its dark doorway. Then look down at the foot of the steep middle stairway for the small upright stones: they show how big the pyramid really is.", "medium": "Cut stone (photograph)", "credit": "Photo: Arian Zwegers, CC BY 2.0", "levels": [{"url": "crops/unknown_maya_builders_of_tikal_for_the_king_jasaw_chan_k_awi_960.jpg", "width": 960, "height": 1128}, {"url": "crops/unknown_maya_builders_of_tikal_for_the_king_jasaw_chan_k_awi_1920.jpg", "width": 1920, "height": 2256}, {"url": "crops/unknown_maya_builders_of_tikal_for_the_king_jasaw_chan_k_awi_3456.jpg", "width": 3456, "height": 4060}], "wiki": "https://en.wikipedia.org/wiki/Tikal_Temple_I", "commons": "https://commons.wikimedia.org/wiki/File:Tikal,_Temple_I_(15932959286).jpg"}, {"region": "Teotihuacan, Monte Albán and the Maya", "title": "Painted Vase with Ruler and Scribe", "artist": "Unknown Maya painter, northern Petén (Guatemala) or southern Campeche (Mexico)", "date": "Late Classic period, 600–900", "location": "Cleveland Museum of Art", "desc": "This tall cylinder vase was painted by a Maya artist in the lowland kingdoms of what is now northern Guatemala or southern Mexico. Maya noble families used painted vessels like this one as fine tableware at feasts, and gave them as gifts to win the support of allies. Many were later placed in tombs with the dead. The painter drew with a brush in colored slips, liquid clays that fire to red, orange, cream and black. The main scene shows a nobleman on a throne, wearing an enormous headdress in the shape of a bird's head, with two attendants kneeling before him. A band of glyphs runs around the rim. Instead of the usual words dedicating the vessel, it repeats signs for death. Where the vase was found is not recorded. A Los Angeles gallery sold it to a Cleveland couple in 1972, and it came to the museum from them in 1990.", "look": "Find the nobleman sitting on his red throne under his giant bird headdress, its long curved beak pointing to the left. Then look at the band of glyphs around the rim, and at the smaller scene below the red stripe.", "medium": "Pottery with burnished, colored slips", "levels": [{"url": "crops/unknown_maya_painter_northern_pet_n_guatemala_or_southern_ca_960.jpg", "width": 960, "height": 2066}, {"url": "crops/unknown_maya_painter_northern_pet_n_guatemala_or_southern_ca_1920.jpg", "width": 1920, "height": 4131}, {"url": "crops/unknown_maya_painter_northern_pet_n_guatemala_or_southern_ca_2388.jpg", "width": 2388, "height": 5138}], "wiki": null, "commons": "https://commons.wikimedia.org/wiki/File:Guatemala,_Northern_Peten_or_Mexico,_Southern_Campeche,_Maya,_Late_Classic,_-_Painted_Vase_with_Ruler_and_Scribe_-_1990.181_-_Cleveland_Museum_of_Art.tif"}, {"region": "The Andes before the Inca", "title": "Gate of the Sun, Tiwanaku", "artist": "Unknown Tiwanaku stone carvers", "date": "About 500–1000 (dates debated)", "location": "Tiwanaku, near Lake Titicaca, Bolivia", "desc": "This photograph shows the Gate of the Sun at Tiwanaku, a great city and pilgrimage center that stood near the southern end of Lake Titicaca, more than 3,800 meters above the sea. Tiwanaku carvers cut the gateway from a single block of andesite, a hard volcanic stone, with sharp corners and smooth faces. Across the top they carved a figure standing on a stepped platform and holding a staff in each hand, with rays around the head. Rows of smaller winged figures turn toward him from both sides. The same staff-holding figure appears on Wari cloth and objects, which shows how far Tiwanaku belief and imagery spread. In the 1800s the gate was found lying on the ground with a large crack through it, and it was later set upright again. Most scholars think it was moved from its first place. The name Gate of the Sun was given long after Tiwanaku fell and does not come from its builders.", "look": "Look above the doorway, in the middle of the top, for the one carved figure that stands out from the stone: that is the staff holder. On both sides of him, faint rows of small carved squares hold his winged attendants. Last, find the crack that runs from the top edge of the stone down to the right corner of the doorway.", "title_orig": "Puerta del Sol", "lang_orig": "es", "medium": "Andesite, carved in relief (photograph)", "credit": "Photo: Fabricio Nina, CC BY 4.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a8/Puerta_del_Sol%2C_Tiwanaku.jpg/960px-Puerta_del_Sol%2C_Tiwanaku.jpg", "width": 960, "height": 570}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a8/Puerta_del_Sol%2C_Tiwanaku.jpg/1920px-Puerta_del_Sol%2C_Tiwanaku.jpg", "width": 1920, "height": 1140}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a8/Puerta_del_Sol%2C_Tiwanaku.jpg/3840px-Puerta_del_Sol%2C_Tiwanaku.jpg", "width": 3840, "height": 2281}], "wiki": "https://en.wikipedia.org/wiki/Gate_of_the_Sun", "commons": "https://commons.wikimedia.org/wiki/File:Puerta_del_Sol,_Tiwanaku.jpg"}, {"region": "Teotihuacan, Monte Albán and the Maya", "title": "Bonampak murals, Room 1", "artist": "Unknown Maya painters, court of Bonampak", "date": "About 790", "location": "Structure 1, Bonampak, Chiapas, Mexico", "desc": "This photograph shows part of the first of three painted rooms in a small temple at Bonampak, a Maya town in the rainforest of Chiapas, in southern Mexico. Around 790 painters covered every wall and vault of the three rooms for Bonampak's king, Yajaw Chan Muwaan, and together the rooms tell the story of his court. This room shows the lords of the court in white capes gathered to see a royal child presented, probably the heir, with musicians playing drums, rattles and turtle shells, and performers in masks. The next room shows a battle and the captives taken in it, and the last a great dance and the royal women letting their own blood in thanks. The painters worked on fresh lime plaster, including the bright Maya blue made from a clay and a plant dye. The murals are among the fullest pictures of Maya court life that survive. In May 1946 two Lacandon Maya men, Acasio Chan and José Pepe Chambor, led the American photographer Giles Healey to the ruins and showed him the murals.", "look": "Follow the musicians from left to right. Each holds up round rattles, and tall feathered headdresses rise above their heads. The blue behind them is Maya blue, a color that has lasted more than twelve hundred years.", "medium": "Paint on plaster (photograph)", "credit": "Photo: Arian Zwegers, CC BY 2.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b1/Bonampak%2C_Temple_of_the_Murals%2C_musicians_%2814179847567%29.jpg/960px-Bonampak%2C_Temple_of_the_Murals%2C_musicians_%2814179847567%29.jpg", "width": 960, "height": 640}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b1/Bonampak%2C_Temple_of_the_Murals%2C_musicians_%2814179847567%29.jpg/1920px-Bonampak%2C_Temple_of_the_Murals%2C_musicians_%2814179847567%29.jpg", "width": 1920, "height": 1280}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b1/Bonampak%2C_Temple_of_the_Murals%2C_musicians_%2814179847567%29.jpg/3840px-Bonampak%2C_Temple_of_the_Murals%2C_musicians_%2814179847567%29.jpg", "width": 3840, "height": 2560}], "wiki": "https://en.wikipedia.org/wiki/Bonampak", "commons": "https://commons.wikimedia.org/wiki/File:Bonampak,_Temple_of_the_Murals,_musicians_(14179847567).jpg"}, {"region": "The Andes before the Inca", "title": "Tunic with Sacrificer", "artist": "Unknown Wari weavers, central Andes", "date": "About 600–1000", "location": "Cleveland Museum of Art, Cleveland", "desc": "The Wari ruled much of highland Peru from their capital near present-day Ayacucho, and fine woven tunics were among the most valued things they made. Weavers built this tunic in tapestry weave, packing dyed camelid yarn tightly over cotton threads so that the colored yarn hides the cotton completely. It was woven in two panels and sewn together up the middle, with a slit left for the head. The same figure repeats down each column in changing colors, sometimes turned the other way: a supernatural being holding an axe behind its back and a short staff topped with a severed human head in front. Wari weavers squeezed and stretched such figures until they became patterns of blocks, eyes and bars, a style that marks the finest Wari weaving. A tunic like this was worn by a man of high rank. The museum notes it was shortened on one side long ago. The Cleveland Museum of Art bought it in 2007.", "look": "Find the slit at the top center where the head went through. Then pick one gold column and hunt for a face: a split eye, a nose, and a black and white mouth full of teeth. The same figure repeats all the way down, each time in a different mix of colors.", "medium": "Camelid fiber and cotton, tapestry weave", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/11/South_America%2C_Peru%2C_Central_Andes%2C_Middle_Horizon%2C_Wari_people%2C_7th-11th_c_-_Tunic_with_Sacrificer_-_2007.179_-_Cleveland_Museum_of_Art.tif/lossy-page1-960px-South_America%2C_Peru%2C_Central_Andes%2C_Middle_Horizon%2C_Wari_people%2C_7th-11th_c_-_Tunic_with_Sacrificer_-_2007.179_-_Cleveland_Museum_of_Art.tif.jpg", "width": 960, "height": 937}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/11/South_America%2C_Peru%2C_Central_Andes%2C_Middle_Horizon%2C_Wari_people%2C_7th-11th_c_-_Tunic_with_Sacrificer_-_2007.179_-_Cleveland_Museum_of_Art.tif/lossy-page1-1920px-South_America%2C_Peru%2C_Central_Andes%2C_Middle_Horizon%2C_Wari_people%2C_7th-11th_c_-_Tunic_with_Sacrificer_-_2007.179_-_Cleveland_Museum_of_Art.tif.jpg", "width": 1920, "height": 1875}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/11/South_America%2C_Peru%2C_Central_Andes%2C_Middle_Horizon%2C_Wari_people%2C_7th-11th_c_-_Tunic_with_Sacrificer_-_2007.179_-_Cleveland_Museum_of_Art.tif/lossy-page1-3840px-South_America%2C_Peru%2C_Central_Andes%2C_Middle_Horizon%2C_Wari_people%2C_7th-11th_c_-_Tunic_with_Sacrificer_-_2007.179_-_Cleveland_Museum_of_Art.tif.jpg", "width": 3840, "height": 3750}], "wiki": "https://en.wikipedia.org/wiki/Wari_culture", "commons": "https://commons.wikimedia.org/wiki/File:South_America,_Peru,_Central_Andes,_Middle_Horizon,_Wari_people,_7th-11th_c_-_Tunic_with_Sacrificer_-_2007.179_-_Cleveland_Museum_of_Art.tif"}, {"region": "The Isthmus, the Caribbean and the Amazon", "title": "Funerary Urn", "artist": "Unknown Marajoara potter of Marajó Island", "date": "About 400–1400", "location": "Museu de Arte de São Paulo (MASP), São Paulo", "desc": "This urn was made on Marajó, the huge island at the mouth of the Amazon, to hold the bones of the dead. For about a thousand years the Marajoara people built large earth mounds above the floodwaters and set their houses and cemeteries on top of them. Many of the dead were buried twice: first in the ground, then later their bones were gathered and placed in a painted urn like this one. The potter covered the clay with light and red slips, a thin liquid clay, and then cut the design through them with a sharp tool. The pattern is laid out in bands and panels, with spirals, stepped lines and hooked shapes locked tightly together. Marajoara pottery is among the most elaborate ever made in the Amazon, and it shows that large, settled societies lived on Marajó for about a thousand years, from about 400 to 1400. The urn belongs to the collection gathered by Oscar and Edith Landmann, on long-term loan to MASP since 2016.", "look": "Follow the big curving line that crosses the middle of the urn from side to side, then find the spiral where it curls up at the right. Around it, look for the tiny steps and zigzags cut into the clay, and the thin bands of repeating hooks at the top and bottom.", "title_orig": "Urna funerária", "lang_orig": "pt", "medium": "Ceramic, slip paint, incised", "credit": "Photo: Dornicke, CC BY-SA 4.0", "levels": [{"url": "crops/unknown_marajoara_potter_of_maraj_island_funerary_urn_960.jpg", "width": 960, "height": 1245}, {"url": "crops/unknown_marajoara_potter_of_maraj_island_funerary_urn_1920.jpg", "width": 1920, "height": 2490}, {"url": "crops/unknown_marajoara_potter_of_maraj_island_funerary_urn_2500.jpg", "width": 2500, "height": 3242}], "wiki": "https://en.wikipedia.org/wiki/Marajoara_culture", "commons": "https://commons.wikimedia.org/wiki/File:Cultura_Marajoara_-_Urna_funer%C3%A1ria,_c._400-1350_(MASP_Landmann)_01.jpg"}, {"region": "The Isthmus, the Caribbean and the Amazon", "title": "Stone spheres of the Diquís, Finca 6", "artist": "Unknown stone workers of the Diquís chiefdoms", "date": "About 500–1500", "location": "Finca 6 archaeological site, Palmar Sur, Osa, Costa Rica", "desc": "This photograph shows stone spheres at Finca 6, an excavated settlement in the Diquís delta of southern Costa Rica. The people of the chiefdoms that lived here shaped hundreds of these balls from hard stone, most often granodiorite, by pecking and grinding a boulder until it was almost perfectly round. Some are smaller than a football and the largest are over two meters across. They were placed in lines and groups on earth mounds and plazas near the houses of important people, and they probably marked rank and power. The United Fruit Company was clearing the land for banana plantations when its workers found them in the 1930s and 1940s. Many were moved away as garden ornaments, and some were broken open by people who wrongly hoped to find gold inside. Since 2014 Finca 6 and three other settlements have been a UNESCO World Heritage Site.", "look": "Start with the big dark sphere in front, and see how smoothly its curve runs from one side to the other. Then count the spheres behind it in the clearing, big and small, set out in rows and groups.", "medium": "Granodiorite and other hard stone (photograph)", "credit": "Photo: Diego Padilla Durán and Mariordo (Mario Roberto Durán Ortiz), CC BY-SA 4.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c1/Diquis_Stone_Spheres_in_situ_Finca_6_CR_12_2020.jpg/960px-Diquis_Stone_Spheres_in_situ_Finca_6_CR_12_2020.jpg", "width": 960, "height": 640}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c1/Diquis_Stone_Spheres_in_situ_Finca_6_CR_12_2020.jpg/1920px-Diquis_Stone_Spheres_in_situ_Finca_6_CR_12_2020.jpg", "width": 1920, "height": 1280}, {"url": "https://upload.wikimedia.org/wikipedia/commons/c/c1/Diquis_Stone_Spheres_in_situ_Finca_6_CR_12_2020.jpg", "width": 3000, "height": 2000}], "wiki": "https://en.wikipedia.org/wiki/Stone_spheres_of_Costa_Rica", "commons": "https://commons.wikimedia.org/wiki/File:Diquis_Stone_Spheres_in_situ_Finca_6_CR_12_2020.jpg"}, {"region": "North America", "title": "Monks Mound, Cahokia", "artist": "Unknown Mississippian builders of Cahokia", "date": "Built in stages, about 950–1200", "location": "Cahokia Mounds State Historic Site, Collinsville, Illinois", "desc": "This is a photograph of Monks Mound, the largest earthen mound built in the Americas north of Mexico. It stands at the heart of Cahokia, near the Mississippi River across from present-day St. Louis. Around 1100 Cahokia was the largest city north of Mexico, home to many thousands of people, with a great plaza and more than a hundred mounds. People raised Monks Mound in many stages, mostly between about 950 and 1200, carrying earth in baskets on their backs. Its flat top held a large building, probably the home or temple of Cahokia's leaders, high above the plaza where crowds gathered for ceremonies and games. The name comes from French Trappist monks who lived nearby in the early 1800s. Descendants of Cahokia's builders include the Osage, Chickasaw and Peoria nations, whom the federal government forced out of the region from 1830 and who live today mostly in Oklahoma.", "look": "Look for the tiny people standing at the top of the stairs and the red truck parked at the bottom. Then think about it: every bit of this hill was carried here by hand, one basket of earth at a time.", "medium": "Earth mound (photograph)", "credit": "Photo: Skubasteve834, CC BY 4.0", "levels": [{"url": "crops/unknown_mississippian_builders_of_cahokia_monks_mound_cahoki_960.jpg", "width": 960, "height": 384}, {"url": "crops/unknown_mississippian_builders_of_cahokia_monks_mound_cahoki_1920.jpg", "width": 1920, "height": 768}, {"url": "crops/unknown_mississippian_builders_of_cahokia_monks_mound_cahoki_3840.jpg", "width": 3840, "height": 1536}], "wiki": "https://en.wikipedia.org/wiki/Monks_Mound", "commons": "https://commons.wikimedia.org/wiki/File:Monks_Mound_-_Summer_2024.jpg"}, {"region": "The Isthmus, the Caribbean and the Amazon", "title": "Muisca Raft", "artist": "Unknown Muisca goldsmith", "date": "About 600–1600", "location": "Museo del Oro, Bogotá", "desc": "This small gold raft was made by the Muisca, who lived in the high valleys around present-day Bogotá. It was an offering, not a thing for daily use: Muisca people placed gold figures in caves and lakes as gifts to the sacred powers. In 1969 a farmer, Cruz María Dimaté, and his son found it in a cave in the high moors near Pasca, south of Bogotá. The goldsmith modeled the whole scene in wax, from the woven raft to the tiny people, then cast it in one piece. The large central figure is a ruler, surrounded by ten smaller attendants. Spanish writers of the 1600s described a ceremony at Lake Guatavita in which a new ruler, covered in gold dust, sailed out on a raft and gave gold to the lake. That story grew into the Spanish legend of El Dorado, and this raft has become its best-known image.", "look": "Find the tall figure in the middle with the big headdress: he is the ruler, and he is much larger than everyone else on board. Count the smaller people around him, and see how the floor of the raft is made of thin gold threads laid side by side like logs.", "title_orig": "Balsa Muisca", "lang_orig": "es", "medium": "Gold alloy, lost-wax cast", "credit": "Photo: Mariordo (Mario Roberto Durán Ortiz), CC BY-SA 4.0", "levels": [{"url": "crops/unknown_muisca_goldsmith_muisca_raft_960.jpg", "width": 960, "height": 867}, {"url": "crops/unknown_muisca_goldsmith_muisca_raft_1920.jpg", "width": 1920, "height": 1734}, {"url": "crops/unknown_muisca_goldsmith_muisca_raft_2604.jpg", "width": 2604, "height": 2352}], "wiki": "https://en.wikipedia.org/wiki/Muisca_raft", "commons": "https://commons.wikimedia.org/wiki/File:Balsa_Muisca_BOG_03_2018_8506.jpg"}, {"region": "North America", "title": "Cliff Palace, Mesa Verde", "artist": "Unknown Ancestral Pueblo builders", "date": "Built about 1190–1280, mostly after 1260", "location": "Mesa Verde National Park, Colorado", "desc": "This is a photograph of Cliff Palace, the largest cliff dwelling in North America, built by Ancestral Pueblo people under a sandstone overhang at Mesa Verde. Tree-ring dates from its wooden beams show building from about 1190 to 1280, with most of the work done in the last twenty years. The builders shaped sandstone blocks, laid them in mud mortar, and fitted wooden beams for floors and roofs, making about 150 rooms. The round, sunken rooms are kivas, where people met for ceremonies and community business. By about 1300 the people had moved south to the Rio Grande valley and the Arizona mesas. Their descendants are today's Pueblo nations, including the Hopi, Zuni and the pueblos of New Mexico, who regard Mesa Verde as an ancestral home. In 1891 the Swedish researcher Gustaf Nordenskiöld dug at Cliff Palace and other Mesa Verde sites and shipped human remains and burial objects to Sweden. The collection passed to the National Museum of Finland, which in 2020 returned the remains of 20 people and 28 objects buried with them to the Hopi Tribe and the pueblos of Acoma, Zia and Zuni.", "look": "Find the round kivas, open circles sunk into the ground in front of the rooms. Then look for the tallest building, a square tower rising toward the top of the cave, and see how the whole village fits under the rock roof.", "medium": "Sandstone, mortar and wood, built in place (photograph)", "credit": "Photo: National Park Service (NPGallery), public domain", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/56/Cliff_Palace_of_the_cliff_dwellings_at_Mesa_Verde_National_Park._%2824684246f7fa40b6b21b507589b3008e%29.jpg/960px-Cliff_Palace_of_the_cliff_dwellings_at_Mesa_Verde_National_Park._%2824684246f7fa40b6b21b507589b3008e%29.jpg", "width": 960, "height": 644}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/56/Cliff_Palace_of_the_cliff_dwellings_at_Mesa_Verde_National_Park._%2824684246f7fa40b6b21b507589b3008e%29.jpg/1920px-Cliff_Palace_of_the_cliff_dwellings_at_Mesa_Verde_National_Park._%2824684246f7fa40b6b21b507589b3008e%29.jpg", "width": 1920, "height": 1287}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/56/Cliff_Palace_of_the_cliff_dwellings_at_Mesa_Verde_National_Park._%2824684246f7fa40b6b21b507589b3008e%29.jpg/3840px-Cliff_Palace_of_the_cliff_dwellings_at_Mesa_Verde_National_Park._%2824684246f7fa40b6b21b507589b3008e%29.jpg", "width": 3840, "height": 2574}], "wiki": "https://en.wikipedia.org/wiki/Cliff_Palace", "commons": "https://commons.wikimedia.org/wiki/File:Cliff_Palace_of_the_cliff_dwellings_at_Mesa_Verde_National_Park._(24684246f7fa40b6b21b507589b3008e).jpg"}, {"region": "The Andes before the Inca", "title": "Squirrel reliefs in the Nik An palace, Chan Chan", "artist": "Unknown Chimú builders and relief makers", "date": "About 1100–1470", "location": "Chan Chan, near Trujillo, Peru", "desc": "This photograph shows clay reliefs on a wall at Chan Chan, the capital of the Chimú kingdom on the north coast of Peru. Chan Chan was the largest city in the Americas built of adobe, sun-dried mud brick. Its center was a set of walled palace compounds, each built for a Chimú king and his court, with courtyards, storerooms and a burial platform. Workers covered the high walls with bands of animals, birds, fish and net patterns, shaped in molds and pressed into wet clay. This wall stands in the compound now called Nik An, also known as the Tschudi palace, where a court is known for its reliefs of squirrels carrying their young. The Inca ruler Tupac Yupanqui conquered the Chimú around 1470 and took their king, Minchancaman, to Cusco as a captive. Rain and flooding wear the mud walls away. Much of the relief seen today has been restored, and some panels here are modern copies, so parts of this wall may be new.", "look": "Follow the row of squirrels from left to right. Each one has a big round body, tiny clawed feet, and a huge tail of curved bands that curls up over its back. Inside each body is a smaller animal with its own round eye: archaeologists read it as a baby. Then look for the small triangles tucked between them.", "medium": "Molded clay relief on adobe walls (photograph, restored)", "credit": "Photo: Bernard Gagnon, CC BY-SA 3.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4e/Chan_Chan_-_reliefs.jpg/960px-Chan_Chan_-_reliefs.jpg", "width": 960, "height": 653}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4e/Chan_Chan_-_reliefs.jpg/1920px-Chan_Chan_-_reliefs.jpg", "width": 1920, "height": 1307}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4e/Chan_Chan_-_reliefs.jpg/3840px-Chan_Chan_-_reliefs.jpg", "width": 3840, "height": 2614}], "wiki": "https://en.wikipedia.org/wiki/Chan_Chan", "commons": "https://commons.wikimedia.org/wiki/File:Chan_Chan_-_reliefs.jpg"}, {"region": "The Isthmus, the Caribbean and the Amazon", "title": "Taíno ritual seat (duho)", "artist": "Unknown Taíno carver of Hispaniola", "date": "About 1290–1400", "location": "British Museum, London", "desc": "This carved wooden seat is a duho, the ceremonial seat of a Taíno cacique, or chief. The Taíno lived across the Caribbean islands, and this seat was found near Santo Domingo, on the island of Hispaniola. A cacique sat on a duho during the cohoba ceremony, when he breathed in a powerful snuff to speak with the cemís, the spirits and ancestors who guided the community. Sitting on it raised him above everyone else and set him in the spirit world. The carver shaped the seat from dense guayacán wood as a crouching man on all fours, with a long curved back, and set gold in his eyes, mouth and shoulders so they shone. Spanish writers described duhos among the first Taíno objects they saw, in the 1490s. The British Museum bought this seat in 1949 from the Oldman collection; how it left Hispaniola before then is not recorded. Spanish forced labor, massacres and new diseases killed most of Hispaniola's Taíno within a few decades of conquest, but Taíno descendants in the Caribbean and beyond keep the name and the memory alive.", "look": "Find the crouching figure at the right end, standing on all fours: his body holds up the front of the seat. Look for his pale shining eyes, which are set with gold. Then follow the long back as it sweeps up to the left, and find the carved oval pattern near the top.", "medium": "Wood, gold", "credit": "Photo: Mike Peel, CC BY-SA 4.0", "levels": [{"url": "crops/unknown_ta_no_carver_of_hispaniola_ta_no_ritual_seat_duho_960.jpg", "width": 960, "height": 543}, {"url": "crops/unknown_ta_no_carver_of_hispaniola_ta_no_ritual_seat_duho_1920.jpg", "width": 1920, "height": 1086}, {"url": "crops/unknown_ta_no_carver_of_hispaniola_ta_no_ritual_seat_duho_3840.jpg", "width": 3840, "height": 2172}], "wiki": "https://en.wikipedia.org/wiki/Ta%C3%ADno", "commons": "https://commons.wikimedia.org/wiki/File:Taino_ritual_seat.jpg"}, {"region": "Mixtecs, Aztecs and Inca", "title": "Codex Zouche-Nuttall", "artist": "Unknown Mixtec painters", "date": "About 1200–1521 (museum estimate)", "location": "British Museum, London", "desc": "This is a painted book of the Mixtec people of Oaxaca, in southern Mexico, shown open in its case at the British Museum. It is a long strip of deerskin covered in white plaster, painted on both sides, and folded like a screen. Mixtec painters wrote history in pictures: people, places and dates are shown by figures and signs that a trained reader could read aloud at court. One side tells the life of Lord Eight Deer Jaguar Claw, a ruler of Tilantongo who lived from 1063 to 1115 and conquered many towns. The other side records the ruling families of Mixtec towns and their histories. Each person is named for the day of their birth, counted with dots. How the book left Mexico is not known. It was found in a monastery in Florence in 1859, and the family of Lord Zouche gave it to the British Museum in 1917.", "look": "Follow the thin red lines: they tell the reader which way to go, zigzagging up and down the page. Near many of the painted people, count the small round dots beside a sign. Together they give that person's name, taken from the day they were born.", "medium": "Paint on deerskin", "credit": "Photo: Michel wal, CC BY-SA 3.0", "levels": [{"url": "crops/unknown_mixtec_painters_codex_zouche_nuttall_960.jpg", "width": 960, "height": 547}, {"url": "crops/unknown_mixtec_painters_codex_zouche_nuttall_1920.jpg", "width": 1920, "height": 1094}, {"url": "crops/unknown_mixtec_painters_codex_zouche_nuttall_3840.jpg", "width": 3840, "height": 2189}], "wiki": "https://en.wikipedia.org/wiki/Codex_Zouche-Nuttall", "commons": "https://commons.wikimedia.org/wiki/File:Codex_Zouche-Nuttall_01.jpg"}, {"region": "Mixtecs, Aztecs and Inca", "title": "Machu Picchu", "artist": "Unknown Inca builders, for the ruler Pachacuti", "date": "Built about 1420–50 (dates debated)", "location": "Machu Picchu, Cusco Region, Peru", "desc": "This is a photograph of Machu Picchu, an Inca royal estate built on a mountain ridge high above the Urubamba River in Peru. Most scholars believe it was built for the ruler Pachacuti, who made the Inca state into an empire in the 1400s. The finest temples and houses are of granite blocks cut to fit so closely that no mortar was needed. Terraces for farming step down the steep slopes, and channels carried spring water through the town. It was left empty around the time of the Spanish conquest, and the Spanish seem never to have found it. Local farming families still lived and worked there in 1911, when they guided the Yale lecturer Hiram Bingham to the ruins. Bingham's expeditions shipped thousands of objects to Yale University, and after a long campaign by Peru, Yale returned them between 2011 and 2012.", "look": "Find the flat green lawn in the middle of the town, then look at the stone terraces stepping down the slope in front of you like a giant staircase. Behind rises the sharp peak of Huayna Picchu. The builders shaped their town to follow the mountain.", "title_orig": "Machu Pikchu", "lang_orig": "qu", "medium": "Cut stone (photograph)", "credit": "Photo: Martin St-Amant, CC BY-SA 3.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c9/80_-_Machu_Picchu_-_Juin_2009_-_crop.jpg/960px-80_-_Machu_Picchu_-_Juin_2009_-_crop.jpg", "width": 960, "height": 720}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c9/80_-_Machu_Picchu_-_Juin_2009_-_crop.jpg/1920px-80_-_Machu_Picchu_-_Juin_2009_-_crop.jpg", "width": 1920, "height": 1440}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c9/80_-_Machu_Picchu_-_Juin_2009_-_crop.jpg/3840px-80_-_Machu_Picchu_-_Juin_2009_-_crop.jpg", "width": 3840, "height": 2880}], "wiki": "https://en.wikipedia.org/wiki/Machu_Picchu", "commons": "https://commons.wikimedia.org/wiki/File:80_-_Machu_Picchu_-_Juin_2009_-_crop.jpg"}, {"region": "Mixtecs, Aztecs and Inca", "title": "Inka Khipu (Fiber Recording Device)", "artist": "Unknown Inca khipu maker", "date": "About 1400–1532", "location": "Cleveland Museum of Art", "desc": "A khipu is a record made of knotted cords, and it was how the Inca state kept its accounts. Many cords hang from one main cord, and the kind of knot, its place on the cord and the color of the thread all carried meaning. Numbers were counted in tens, with knots for ones, tens and hundreds set at different heights. Trained record keepers, the khipukamayuq, made and read them, recording
