 people, herds, harvests, tribute and the goods in state storehouses. Spanish officials at first relied on khipu keepers for this information. Some scholars believe khipus also held histories and stories, and researchers are still working to read them. This khipu was given to the Cleveland Museum of Art by John Wise in 1940.", "look": "Find the thick curved main cord in the middle, then follow the many cords hanging down from it like a fan. Look for the little lumps along each cord: those are knots, and their places told a trained reader a number. Notice the different colors, from dark brown to cream, which also carried meaning.", "medium": "Cotton and wool, knotted and twisted cords", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/52/Peru%2C_Inca_Period%2C_15th-16th_Century_-_Inka_Khipu_%28Fiber_Recording_Device%29_-_1940.469_-_Cleveland_Museum_of_Art.tif/lossy-page1-960px-Peru%2C_Inca_Period%2C_15th-16th_Century_-_Inka_Khipu_%28Fiber_Recording_Device%29_-_1940.469_-_Cleveland_Museum_of_Art.tif.jpg", "width": 960, "height": 798}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/52/Peru%2C_Inca_Period%2C_15th-16th_Century_-_Inka_Khipu_%28Fiber_Recording_Device%29_-_1940.469_-_Cleveland_Museum_of_Art.tif/lossy-page1-1920px-Peru%2C_Inca_Period%2C_15th-16th_Century_-_Inka_Khipu_%28Fiber_Recording_Device%29_-_1940.469_-_Cleveland_Museum_of_Art.tif.jpg", "width": 1920, "height": 1595}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/52/Peru%2C_Inca_Period%2C_15th-16th_Century_-_Inka_Khipu_%28Fiber_Recording_Device%29_-_1940.469_-_Cleveland_Museum_of_Art.tif/lossy-page1-3840px-Peru%2C_Inca_Period%2C_15th-16th_Century_-_Inka_Khipu_%28Fiber_Recording_Device%29_-_1940.469_-_Cleveland_Museum_of_Art.tif.jpg", "width": 3840, "height": 3190}], "wiki": "https://en.wikipedia.org/wiki/Quipu", "commons": "https://commons.wikimedia.org/wiki/File:Peru,_Inca_Period,_15th-16th_Century_-_Inka_Khipu_(Fiber_Recording_Device)_-_1940.469_-_Cleveland_Museum_of_Art.tif"}, {"region": "Mixtecs, Aztecs and Inca", "title": "Tunic", "artist": "Unknown Inca weaver", "date": "About 1400–1540", "location": "Cleveland Museum of Art", "desc": "This tunic is woven in fine interlocked tapestry, the kind of cloth the Inca called cumbi, from cotton and camelid fiber, the hair of llamas and alpacas. In the Inca Empire only the nobility could wear such garments. The weavers were noblewomen, professional weavers and the aqllakuna, the Chosen Women, who lived in closed communities and served the state by weaving fine cloth and brewing beer. The state gave tunics like this one as gifts to loyal lords and allies, and fine cloth was valued as highly as gold. Its pattern of squares, each with a hooked shape and a small square, is known as the Inca key. It was a set design and one of the most common Inca tunic patterns. How it left Peru is not recorded; it came to the Cleveland Museum of Art as a gift in 1957.", "look": "Look at the top half: a checkerboard of light and dark squares. Each square holds a hooked bar and a tiny square inside a square. Every one was built thread by thread on the loom. Then find the slit for the head at the top, the red and brown stripes below, and the zigzag stitches along the hem.", "medium": "Cotton and camelid fiber, tapestry weave", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cd/Peru%2C_Inca%2C_15th-16th_century_-_Tunic_-_1957.136_-_Cleveland_Museum_of_Art.tif/lossy-page1-960px-Peru%2C_Inca%2C_15th-16th_century_-_Tunic_-_1957.136_-_Cleveland_Museum_of_Art.tif.jpg", "width": 960, "height": 1065}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cd/Peru%2C_Inca%2C_15th-16th_century_-_Tunic_-_1957.136_-_Cleveland_Museum_of_Art.tif/lossy-page1-1920px-Peru%2C_Inca%2C_15th-16th_century_-_Tunic_-_1957.136_-_Cleveland_Museum_of_Art.tif.jpg", "width": 1920, "height": 2129}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cd/Peru%2C_Inca%2C_15th-16th_century_-_Tunic_-_1957.136_-_Cleveland_Museum_of_Art.tif/lossy-page1-3840px-Peru%2C_Inca%2C_15th-16th_century_-_Tunic_-_1957.136_-_Cleveland_Museum_of_Art.tif.jpg", "width": 3840, "height": 4258}], "wiki": "https://en.wikipedia.org/wiki/Tocapu", "commons": "https://commons.wikimedia.org/wiki/File:Peru,_Inca,_15th-16th_century_-_Tunic_-_1957.136_-_Cleveland_Museum_of_Art.tif"}, {"region": "Mixtecs, Aztecs and Inca", "title": "Coyolxauhqui Stone", "artist": "Unknown Mexica sculptor of Tenochtitlan", "date": "About 1469–1481, the reign of Axayacatl (dates debated)", "location": "Museo del Templo Mayor, Mexico City", "desc": "This great carved disc of andesite, about 3.25 meters across, shows the goddess Coyolxauhqui, whose name means \"Bells on Her Cheeks.\" In the Mexica story, she led her four hundred brothers against their mother Coatlicue on the mountain of Coatepec. The war god Huitzilopochtli was born fully armed to defend his mother, cut his sister apart and threw her body down the mountain. The Mexica built the Templo Mayor, the great twin temple at the center of their capital Tenochtitlan, as that mountain. The stone lay at the foot of the stairs on Huitzilopochtli's side, so anyone climbing to his shrine stepped past the defeated goddess. On February 21, 1978, workers of the Mexico City electric company struck it while digging under the street. It still lay where the Mexica had set it. The find led to the excavation of the whole temple, and the stone is now shown in the Museo del Templo Mayor beside the ruins.", "look": "Find her head at the top left, seen from the side, with a round bell on her cheek. Then find her arms and legs, cut apart and set around her body like the spokes of a wheel. Snakes are tied around them as belts, and a skull hangs at her waist. The sculptor fit a whole story of war and loss inside one circle.", "title_orig": "Monolito de Coyolxauhqui", "lang_orig": "es", "medium": "Andesite, carved in relief", "credit": "Photo: Mike Peel, CC BY-SA 4.0", "levels": [{"url": "crops/unknown_mexica_sculptor_of_tenochtitlan_coyolxauhqui_stone_960.jpg", "width": 960, "height": 973}, {"url": "crops/unknown_mexica_sculptor_of_tenochtitlan_coyolxauhqui_stone_1920.jpg", "width": 1920, "height": 1945}, {"url": "crops/unknown_mexica_sculptor_of_tenochtitlan_coyolxauhqui_stone_3030.jpg", "width": 3030, "height": 3070}], "wiki": "https://en.wikipedia.org/wiki/Coyolxauhqui_Stone", "commons": "https://commons.wikimedia.org/wiki/File:La_Coyolxauhqui_en_el_Templo_Mayor_2015.jpg"}, {"region": "Mixtecs, Aztecs and Inca", "title": "Double-headed serpent", "artist": "Unknown Mexica or Mixtec mosaic workers", "date": "1400s–early 1500s", "location": "British Museum, London", "desc": "This serpent with a head at each end was carved from a single piece of cedar wood and covered with small pieces of turquoise, set in pine resin. Red spiny oyster shell forms the noses and gums, and white conch shell forms the teeth. Turquoise reached central Mexico along long trade routes, some perhaps from as far north as the lands of the Ancestral Pueblo people. Mixtec artists were the most famous turquoise workers of the time, and many Mixtec towns paid turquoise to the Mexica rulers as tribute. The serpent was probably worn on the chest in ceremonies. Serpents stood for many sacred powers, and the feathered serpent Quetzalcoatl was among the great gods. No one knows how it left Mexico. Spanish accounts say Moctezuma's people gave Hernán Cortés \"a serpent inlaid with turquoise,\" and it may have been that gift or part of the treasure the Spanish took in the conquest of 1519–1521. It later passed through private collections, and the British Museum bought it in 1894.", "look": "Look at the open mouths: rows of white shell teeth, red shell gums, and a red nose on the head at the left. Now follow the body as it loops up and down between the two heads. Every blue-green speck is a separate chip of stone, cut and fitted by hand like a puzzle.", "medium": "Turquoise, spiny oyster shell and conch shell mosaic on cedar wood", "credit": "Photo: Denis Bourez, CC BY 2.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ef/Aztec_double-headed_serpent_-_Denis_Bourez_-_British_Museum%2C_London.jpg/960px-Aztec_double-headed_serpent_-_Denis_Bourez_-_British_Museum%2C_London.jpg", "width": 960, "height": 720}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ef/Aztec_double-headed_serpent_-_Denis_Bourez_-_British_Museum%2C_London.jpg/1920px-Aztec_double-headed_serpent_-_Denis_Bourez_-_British_Museum%2C_London.jpg", "width": 1920, "height": 1440}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ef/Aztec_double-headed_serpent_-_Denis_Bourez_-_British_Museum%2C_London.jpg/3840px-Aztec_double-headed_serpent_-_Denis_Bourez_-_British_Museum%2C_London.jpg", "width": 3840, "height": 2880}], "wiki": "https://en.wikipedia.org/wiki/Double-headed_serpent", "commons": "https://commons.wikimedia.org/wiki/File:Aztec_double-headed_serpent_-_Denis_Bourez_-_British_Museum,_London.jpg"}, {"region": "Mixtecs, Aztecs and Inca", "title": "Aztec Sun Stone", "artist": "Unknown Mexica sculptors of Tenochtitlan", "date": "About 1502–1521 (dates debated)", "location": "Museo Nacional de Antropología, Mexico City", "desc": "The Sun Stone is a disc of basalt about 3.6 meters across and weighing about 24 tonnes, carved by Mexica sculptors in Tenochtitlan. At its center is a face, most often read as the sun god Tonatiuh, though some scholars see the earth deity Tlaltecuhtli. Around the face are the signs of the four earlier suns, or ages of the world, which the Mexica believed had each ended in destruction; they lived under the fifth. A ring of the twenty day signs of the ritual calendar circles them. It is often called the \"Aztec Calendar,\" but it was a monument of belief and royal power, not a calendar to read the date from. Many scholars read the name sign of the ruler Moctezuma II on it and date it to his reign; others place it earlier, under Axayacatl. After the Spanish conquest it was buried in the main square. The friar Diego Durán wrote that Archbishop Alonso de Montúfar ordered it buried. Workers paving the square found it again on December 17, 1790, and it was set into the wall of the cathedral until 1885.", "look": "Start at the face in the very center, with its tongue sticking out like a stone blade and a clawed hand on each side. Then move outward: four boxes around the face hold the four lost worlds, and the next ring holds the twenty day signs, one small picture each. At the bottom, two fire serpents meet face to face.", "title_orig": "Piedra del Sol", "lang_orig": "es", "medium": "Basalt", "credit": "Photo: ProtoplasmaKid, CC BY-SA 4.0", "levels": [{"url": "crops/unknown_mexica_sculptors_of_tenochtitlan_aztec_sun_stone_960.jpg", "width": 960, "height": 932}, {"url": "crops/unknown_mexica_sculptors_of_tenochtitlan_aztec_sun_stone_1920.jpg", "width": 1920, "height": 1863}, {"url": "crops/unknown_mexica_sculptors_of_tenochtitlan_aztec_sun_stone_3840.jpg", "width": 3840, "height": 3727}], "wiki": "https://en.wikipedia.org/wiki/Aztec_sun_stone", "commons": "https://commons.wikimedia.org/wiki/File:Piedra_del_Sol.tif"}, {"region": "Mixtecs, Aztecs and Inca", "title": "Quetzal feather headdress, known as Moctezuma's headdress", "artist": "Unknown Mexica feather workers (amanteca)", "date": "About 1515", "location": "Weltmuseum Wien, Vienna", "desc": "This headdress is about 1.3 meters high and 1.8 meters wide. It holds 374 long green tail feathers of the quetzal bird, with rows of blue, pink and brown feathers and more than a thousand small plates of gold. It was made by amanteca, the Mexica feather workers, whose art was among the most prized in Tenochtitlan. In Nahuatl this kind of headdress is called a quetzalapanecayotl. It has long been linked to the ruler Moctezuma II, but no record proves it was his, and the museum thinks it more likely belonged to a priest. No one knows when or how it left Mexico. It is first listed in 1596, in the collection of Archduke Ferdinand II of Tyrol at Ambras Castle in Austria. Restorers in 1878 replaced some parts, including the blue feathers and some metal plates. Mexico has long wanted it back, and in 2020 asked Austria to lend it for 2021. A joint Austrian and Mexican study in 2010 to 2012 found it too fragile to travel, and it remains in Vienna.", "look": "Start with the long green quetzal feathers fanning out like rays of light. Then move in, band by band: brown feathers edged with gold disks, a thin line of pink, and the bright blue feathers studded with gold at the center. The feather workers laid each color in rows, the way a painter lays down paint.", "title_orig": "Penacho de Moctezuma", "lang_orig": "es", "medium": "Feathers of quetzal, cotinga, roseate spoonbill, squirrel cuckoo and kingfisher; gold, brass, wood, plant fiber, cotton, leather", "credit": "Photo: Richard Mortel, CC BY 2.0", "levels": [{"url": "crops/unknown_mexica_feather_workers_amanteca_feather_headdress_kn_960.jpg", "width": 960, "height": 592}, {"url": "crops/unknown_mexica_feather_workers_amanteca_feather_headdress_kn_1920.jpg", "width": 1920, "height": 1184}, {"url": "crops/unknown_mexica_feather_workers_amanteca_feather_headdress_kn_3840.jpg", "width": 3840, "height": 2368}], "wiki": "https://en.wikipedia.org/wiki/Moctezuma%27s_headdress", "commons": "https://commons.wikimedia.org/wiki/File:Moctezuma%27s_feather_headdress,_ca._1515,_Mexico;_Weltmuseum,_Vienna_(3)_-_color_corrected.jpg"}, {"region": "The colonial Americas", "title": "The Mass of Saint Gregory", "artist": "Nahua feather workers (amanteca) of Mexico-Tenochtitlan, under Fray Pedro de Gante, in the time of Governor Diego de Alvarado Huanitzin", "date": "1539", "location": "Musée des Amériques – Auch, Auch, France", "desc": "This picture is made of feathers, cut and glued in place one by one like the tiles of a mosaic. Nahua feather workers, called amanteca, had made feather shields, headdresses and hangings for the rulers and temples of Tenochtitlan. After the Spanish conquest they turned the same skill to Christian pictures. The Latin words around the border, also made of feathers, say the work was made in the great city of Mexico in 1539, in the time of Pope Paul III, when the Nahua noble Don Diego de Alvarado Huanitzin was governor, and in the care of the Franciscan friar Pedro de Gante. It is one of the first Christian pictures made in the Americas. The scene follows a print by the German engraver Israhel van Meckenem. It shows a legend in which Christ appeared on the altar while Pope Gregory the Great said Mass, surrounded by the tools of his suffering. It may have been meant as a gift for the pope. No one knows how it reached Europe. It turned up at an auction in Paris in 1984 and is now in the museum of the Americas in Auch, in southwestern France.", "look": "Every color here is a feather, not paint. Look at the shining blue background and the red and gold robes of the three kneeling men, laid in tiny pieces like a mosaic. Then find Christ standing in the tomb on the altar, with the cross, hands, heads and coins floating around him. Last, read the letters around the edge. They are made of feathers too.", "medium": "Feathers, amate paper, plant glue and gold on wood", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/19/%28Auch%29_Messe_de_saint_Gr%C3%A9goire_-_Mus%C3%A9e_des_Am%C3%A9riques_%E2%80%93_Auch.jpg/960px-%28Auch%29_Messe_de_saint_Gr%C3%A9goire_-_Mus%C3%A9e_des_Am%C3%A9riques_%E2%80%93_Auch.jpg", "width": 960, "height": 1162}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/19/%28Auch%29_Messe_de_saint_Gr%C3%A9goire_-_Mus%C3%A9e_des_Am%C3%A9riques_%E2%80%93_Auch.jpg/1920px-%28Auch%29_Messe_de_saint_Gr%C3%A9goire_-_Mus%C3%A9e_des_Am%C3%A9riques_%E2%80%93_Auch.jpg", "width": 1920, "height": 2325}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/19/%28Auch%29_Messe_de_saint_Gr%C3%A9goire_-_Mus%C3%A9e_des_Am%C3%A9riques_%E2%80%93_Auch.jpg/3840px-%28Auch%29_Messe_de_saint_Gr%C3%A9goire_-_Mus%C3%A9e_des_Am%C3%A9riques_%E2%80%93_Auch.jpg", "width": 3840, "height": 4650}], "wiki": "https://en.wikipedia.org/wiki/Diego_de_Alvarado_Huanitzin", "commons": "https://commons.wikimedia.org/wiki/File:(Auch)_Messe_de_saint_Gr%C3%A9goire_-_Mus%C3%A9e_des_Am%C3%A9riques_%E2%80%93_Auch.jpg"}, {"region": "The colonial Americas", "title": "Codex Mendoza, folio 2r: the founding of Tenochtitlan", "artist": "Unknown Nahua painters (tlacuilos), Mexico City", "date": "About 1541", "location": "Bodleian Library, Oxford", "desc": "The Codex Mendoza is a painted book made in Mexico City about twenty years after the Spanish conquest, most likely for Antonio de Mendoza, the viceroy who ruled New Spain for the Spanish king, to explain the conquered Mexica (Aztec) empire to that king. Nahua painters, called tlacuilos, painted the pages in their own picture writing, and a scribe added notes in Spanish. The book has three parts: the history of the rulers of Tenochtitlan and their conquests, the tribute each town paid, and the life of a Nahua person from birth to old age. This first page shows the founding of Tenochtitlan. An eagle lands on a cactus growing from a rock, the sign the Mexica were told to look for, and ten founders sit around it, each named by a small picture. According to a later English account, French privateers seized the ship carrying the book to Spain. By 1553 it belonged to André Thevet, cosmographer to the king of France. It passed through English collectors to John Selden, and the Bodleian Library in Oxford acquired it after his death, by 1659.", "look": "Find the eagle on the cactus in the middle: together they make the name sign of Tenochtitlan. Blue bands cut the square into four parts, like the canals of the island city. Look at the seated founders, each with a small name sign beside his head, and the warriors below. At the very top, find the handwritten name of the Frenchman André Thevet.", "medium": "Ink and paint on European paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/aa/CodexMendoza01.jpg/960px-CodexMendoza01.jpg", "width": 960, "height": 1400}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/aa/CodexMendoza01.jpg/1920px-CodexMendoza01.jpg", "width": 1920, "height": 2800}, {"url": "https://upload.wikimedia.org/wikipedia/commons/a/aa/CodexMendoza01.jpg", "width": 2541, "height": 3706}], "wiki": "https://en.wikipedia.org/wiki/Codex_Mendoza", "commons": "https://commons.wikimedia.org/wiki/File:CodexMendoza01.jpg"}, {"region": "The colonial Americas", "title": "Kero (Waisted Cup)", "artist": "Unknown Andean painter, Colonial Inka style", "date": "After 1550", "location": "Cleveland Museum of Art, Cleveland", "desc": "A qero (also spelled kero) is a wooden cup for drinking chicha, beer made from maize. In the Inca state, qeros were made and used in pairs, so that two people could drink together. Sharing drink this way sealed agreements and alliances, following the Andean idea of reciprocity, giving and receiving in return. Andean people kept making and using qeros after the Spanish conquest, and this one was made after 1550. The painter cut the designs into the wood and filled them with colored paste. The top band shows two armies meeting: the Inka in tunics with waistbands, and their enemies, perhaps people of the eastern forests. Painted scenes like this were new in the colonial years, since older qeros carried only carved geometric patterns. The museum also owns a qero from a different pair, painted only with geometric patterns. This cup came to the Cleveland Museum of Art as a gift from John Wise in 1946.", "look": "Find the Inka soldier in the top band, in a dark tunic with a red waistband, carrying a long pole. Look for the feathers on his head, and on the man to his right. Then find the red and yellow patterns in the middle band. Each color was pressed into a groove cut in the wood.", "medium": "Wood, inlaid pigments", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5d/Peru%2C_Colonial_Inka_style%2C_16th_century_-_Kero_%28Waisted_Cup%29_-_1946.233_-_Cleveland_Museum_of_Art.tif/lossy-page1-960px-Peru%2C_Colonial_Inka_style%2C_16th_century_-_Kero_%28Waisted_Cup%29_-_1946.233_-_Cleveland_Museum_of_Art.tif.jpg", "width": 960, "height": 1122}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5d/Peru%2C_Colonial_Inka_style%2C_16th_century_-_Kero_%28Waisted_Cup%29_-_1946.233_-_Cleveland_Museum_of_Art.tif/lossy-page1-1920px-Peru%2C_Colonial_Inka_style%2C_16th_century_-_Kero_%28Waisted_Cup%29_-_1946.233_-_Cleveland_Museum_of_Art.tif.jpg", "width": 1920, "height": 2244}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5d/Peru%2C_Colonial_Inka_style%2C_16th_century_-_Kero_%28Waisted_Cup%29_-_1946.233_-_Cleveland_Museum_of_Art.tif/lossy-page1-3840px-Peru%2C_Colonial_Inka_style%2C_16th_century_-_Kero_%28Waisted_Cup%29_-_1946.233_-_Cleveland_Museum_of_Art.tif.jpg", "width": 3840, "height": 4488}], "wiki": "https://en.wikipedia.org/wiki/Qiru", "commons": "https://commons.wikimedia.org/wiki/File:Peru,_Colonial_Inka_style,_16th_century_-_Kero_(Waisted_Cup)_-_1946.233_-_Cleveland_Museum_of_Art.tif"}, {"region": "The colonial Americas", "title": "Florentine Codex, Book 9: the feather workers", "artist": "Nahua painters and scholars of Tlatelolco, with Bernardino de Sahagún", "date": "1575–1577", "location": "Biblioteca Medicea Laurenziana, Florence", "desc": "The Florentine Codex is a history of Nahua life and belief in twelve books, with nearly 2,500 paintings. The Franciscan friar Bernardino de Sahagún planned it. Nahua elders gave the knowledge, and Nahua scholars trained at the college of Santa Cruz in Tlatelolco, among them Antonio Valeriano, Alonso Vegerano, Martín Jacobita and Pedro de San Buenaventura, wrote it down. Most pages run in two columns, Nahuatl on the right and a Spanish version on the left. Nahuatl was the language of the Mexica (Aztecs), and it is still spoken in Mexico today. Nahua painters made the pictures, mixing their own way of drawing with European shading and space. On this page the pictures fill the Spanish side. Book 9 describes the merchants of the city and its masters of gold, stone and feathers. This page shows the amanteca, the feather workers, with their feathers sorted by color. In 1577 the Spanish crown ordered Sahagún's manuscripts seized, and in 1580 his ally the friar Rodrigo de Sequera took the finished book to Rome. By 1588 it belonged to the Medici family in Florence, and it has stayed in Florence ever since.", "look": "In the top picture, find the feather worker on his stool holding a fan of yellow feathers. Next to him, a feather shape is drawn on paper, and small feathers lie below, sorted by color. In the two pictures below, count the bundles of green, yellow, red and blue feathers. The writing on the right is Nahuatl.", "title_orig": "Historia general de las cosas de Nueva España", "lang_orig": "es", "medium": "Ink and watercolor on paper", "credit": "Image: Digital Edition of the Florentine Codex, Gary Francisco Keller, Arizona State University, CC BY 3.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8a/The_Florentine_Codex-_Aztec_Feather_Painters_I.tif/lossy-page1-960px-The_Florentine_Codex-_Aztec_Feather_Painters_I.tif.jpg", "width": 960, "height": 1413}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8a/The_Florentine_Codex-_Aztec_Feather_Painters_I.tif/lossy-page1-1920px-The_Florentine_Codex-_Aztec_Feather_Painters_I.tif.jpg", "width": 1920, "height": 2827}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8a/The_Florentine_Codex-_Aztec_Feather_Painters_I.tif/lossy-page1-1920px-The_Florentine_Codex-_Aztec_Feather_Painters_I.tif.jpg", "width": 2420, "height": 3563}], "wiki": "https://en.wikipedia.org/wiki/Florentine_Codex", "commons": "https://commons.wikimedia.org/wiki/File:The_Florentine_Codex-_Aztec_Feather_Painters_I.tif"}, {"region": "The colonial Americas", "title": "The First New Chronicle and Good Government: January, work in the maize fields", "artist": "Felipe Guaman Poma de Ayala", "date": "About 1615", "location": "Royal Danish Library, Copenhagen", "desc": "Felipe Guaman Poma de Ayala was an Andean author who said he came from a noble family. He spoke Quechua and wrote mostly in Spanish, with long passages in Quechua. His book is nearly 1,200 pages long with about 400 full-page drawings. He wrote it as a long letter to King Philip III of Spain. It tells the history of the Andes from the first people through the Inca to the Spanish conquest, and it protests the abuse of Andean people by Spanish officials, priests and landowners. A run of drawings follows the farming year month by month. This page shows January, the rainy season, when a man and a woman heap earth around the young maize. Of this month he wrote: \"In this month is the great lack of food in the kingdom.\" The big Quechua heading means \"maize and potatoes, time of hilling the earth.\" No one knows if the king ever saw the book. It was in the Royal Danish Library in Copenhagen by the 1780s, but it lay unread until the scholar Richard Pietschmann made it known in 1908.", "look": "Find the man and the woman bending over the young maize with their hoes. Above them, rain falls from curly clouds next to a thin moon. Then find the person sitting in the doorway of the house on the right. At the top, the small word means \"work\" in Spanish, and the big line under it is Quechua.", "title_orig": "El primer nueva corónica y buen gobierno", "lang_orig": "es", "medium": "Ink on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/09/Guam%C3%A1n_Poma_1615_1132_enero.png/960px-Guam%C3%A1n_Poma_1615_1132_enero.png", "width": 960, "height": 1400}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/09/Guam%C3%A1n_Poma_1615_1132_enero.png/1920px-Guam%C3%A1n_Poma_1615_1132_enero.png", "width": 1920, "height": 2800}, {"url": "https://upload.wikimedia.org/wikipedia/commons/0/09/Guam%C3%A1n_Poma_1615_1132_enero.png", "width": 2670, "height": 3894}], "wiki": "https://en.wikipedia.org/wiki/El_primer_nueva_cor%C3%B3nica_y_buen_gobierno", "commons": "https://commons.wikimedia.org/wiki/File:Guam%C3%A1n_Poma_1615_1132_enero.png"}, {"region": "The colonial Americas", "title": "The Last Judgment", "artist": "Diego Quispe Tito", "date": "1675", "location": "Convento de San Francisco, Cusco", "desc": "Diego Quispe Tito was a Quechua painter from San Sebastián, near Cusco, and came from an old Inca family. He was one of the leading masters of the Cusco School, where Andean painters worked for the churches of the viceroyalty of Peru. He learned from European prints and made the style his own. For this canvas he worked from a 1606 print by the French engraver Philippe Thomassin and turned its tall design into a wide one. It shows the end of time as Christians believe it: Christ comes as judge and every soul is sent to heaven or to hell. Angels lead the saved to the gate of heaven on the left, while devils drive the damned toward the right. The bottom band is hell itself, full of punishments. Spanish words run across the canvas, spoken by the lost: \"Woe to us, why did we sin?\" The Franciscan friars of Cusco ordered the painting in 1675 for the entrance hall of their convent, where it still hangs. People who could not read the words could still follow the picture.", "look": "Start at the top, where Christ in a red cloak rises above a blue globe among rows of saints. Follow the saved people on the left toward the tall gate of heaven, and the falling people on the right. Then find the long line of Spanish words and, in the bottom right corner, the huge open jaws of the mouth of hell.", "title_orig": "El Juicio Final", "lang_orig": "es", "medium": "Oil on canvas", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/02/El_Juicio_Final_%28Las_Postrimer%C3%ADas%29_-_c.1675_-_Diego_Quispe_Tito.jpg/960px-El_Juicio_Final_%28Las_Postrimer%C3%ADas%29_-_c.1675_-_Diego_Quispe_Tito.jpg", "width": 960, "height": 426}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/02/El_Juicio_Final_%28Las_Postrimer%C3%ADas%29_-_c.1675_-_Diego_Quispe_Tito.jpg/1920px-El_Juicio_Final_%28Las_Postrimer%C3%ADas%29_-_c.1675_-_Diego_Quispe_Tito.jpg", "width": 1920, "height": 851}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/02/El_Juicio_Final_%28Las_Postrimer%C3%ADas%29_-_c.1675_-_Diego_Quispe_Tito.jpg/3840px-El_Juicio_Final_%28Las_Postrimer%C3%ADas%29_-_c.1675_-_Diego_Quispe_Tito.jpg", "width": 3840, "height": 1702}], "wiki": "https://en.wikipedia.org/wiki/Diego_Quispe_Tito", "commons": "https://commons.wikimedia.org/wiki/File:El_Juicio_Final_(Las_Postrimer%C3%ADas)_-_c.1675_-_Diego_Quispe_Tito.jpg"}, {"region": "The colonial Americas", "title": "Robe of the Three Villages", "artist": "Unknown Quapaw painter, Arkansas River", "date": "About 1740", "location": "Musée du quai Branly – Jacques Chirac, Paris", "desc": "This robe was painted by a Quapaw artist in about 1740, in what is now Arkansas. The Quapaw lived in villages near where the Arkansas River meets the Mississippi. The French, who called them the Arkansas, kept a trading post, Arkansas Post, beside them, and the two were allies. Robes like this were worn around the shoulders. No one knows whether the French ordered this one or the Quapaw gave it to them. Words written on the hide name three Quapaw villages and the word \"Ackansas.\" Scholars read other scenes as the French post and a battle in which Quapaw warriors fought the Chickasaw. A red sun and a pale moon hang in the sky of the robe. No one knows how the robe reached France. It was in a French royal cabinet of curiosities that passed in 1806 to the town library of Versailles, which deposited it at the Trocadéro ethnography museum in 1934, and it was later kept at the Musée de l'Homme in Paris. It was lent back to Arkansas for an exhibition in 1995, and it has been at the quai Branly since 2006.", "look": "Find the big red sun with its rays, then the pale gray moon to its left. Below them, follow the line of small painted men walking and kneeling, some aiming bows and guns, and look at the fringe of red and black marks the painter drew around the edge.", "title_orig": "Robe dite aux trois villages", "lang_orig": "fr", "medium": "Painted bison hide", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9c/Robe_dite_aux_trois_villages%2C_Qwapah%2C_Arkansas%2C_Mus%C3%A9e_du_quai_Branly.jpg/960px-Robe_dite_aux_trois_villages%2C_Qwapah%2C_Arkansas%2C_Mus%C3%A9e_du_quai_Branly.jpg", "width": 960, "height": 638}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9c/Robe_dite_aux_trois_villages%2C_Qwapah%2C_Arkansas%2C_Mus%C3%A9e_du_quai_Branly.jpg/1920px-Robe_dite_aux_trois_villages%2C_Qwapah%2C_Arkansas%2C_Mus%C3%A9e_du_quai_Branly.jpg", "width": 1920, "height": 1277}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9c/Robe_dite_aux_trois_villages%2C_Qwapah%2C_Arkansas%2C_Mus%C3%A9e_du_quai_Branly.jpg/3840px-Robe_dite_aux_trois_villages%2C_Qwapah%2C_Arkansas%2C_Mus%C3%A9e_du_quai_Branly.jpg", "width": 3840, "height": 2553}], "wiki": "https://en.wikipedia.org/wiki/Quapaw", "commons": "https://commons.wikimedia.org/wiki/File:Robe_dite_aux_trois_villages,_Qwapah,_Arkansas,_Mus%C3%A9e_du_quai_Branly.jpg"}, {"region": "The colonial Americas", "title": "Portrait of Sor Juana Inés de la Cruz", "artist": "Miguel Cabrera", "date": "About 1750", "location": "Museo Nacional de Historia, Castillo de Chapultepec, Mexico City", "desc": "Sor Juana Inés de la Cruz (1648–1695) was a poet, playwright and scholar of New Spain, and one of the great writers in the Spanish language. She became a Hieronymite nun in Mexico City in 1669 and stayed in her convent for the rest of her life, reading, writing and building a large library. Answering the bishop of Puebla, who had urged her to turn from secular study, she wrote in 1691: \"I study because I must.\" Miguel Cabrera, born in Oaxaca, was the most admired painter in New Spain in his day. He painted this portrait about fifty-five years after her death, so she never sat for it. He shows her in the white habit and black veil of her order, seated in her library among rows of books. One hand rests on an open book, and the other holds a long rosary. The large painted medallion on her chest, called a nun's shield, was part of the dress of nuns in her convent.", "look": "Look past the nun to the shelves behind her: count the rows of books, and find the inkwell and quill pens on the red table. Cabrera filled the room with books to tell you what mattered most in her life.", "title_orig": "Retrato de Sor Juana Inés de la Cruz", "lang_orig": "es", "medium": "Oil on canvas", "credit": "Photo: José Luiz, CC BY-SA 4.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3f/%27S%C3%B3r_Juana_In%C3%A9s_de_la_Cruz%27%2C_Miguel_Cabrera_%281750%29_-_Museo_Nacional_de_Hist%C3%B3ria_-_Mexico_2024.jpg/960px-%27S%C3%B3r_Juana_In%C3%A9s_de_la_Cruz%27%2C_Miguel_Cabrera_%281750%29_-_Museo_Nacional_de_Hist%C3%B3ria_-_Mexico_2024.jpg", "width": 960, "height": 1325}, {"url": "https://upload.wikimedia.org/wikipedia/commons/3/3f/%27S%C3%B3r_Juana_In%C3%A9s_de_la_Cruz%27%2C_Miguel_Cabrera_%281750%29_-_Museo_Nacional_de_Hist%C3%B3ria_-_Mexico_2024.jpg", "width": 1661, "height": 2293}], "wiki": "https://en.wikipedia.org/wiki/Miguel_Cabrera_%28painter%29", "commons": "https://commons.wikimedia.org/wiki/File:%27S%C3%B3r_Juana_In%C3%A9s_de_la_Cruz%27,_Miguel_Cabrera_(1750)_-_Museo_Nacional_de_Hist%C3%B3ria_-_Mexico_2024.jpg"}, {"region": "The colonial Americas", "title": "The Last Supper", "artist": "Marcos Zapata", "date": "About 1753", "location": "Cusco Cathedral, Cusco", "desc": "This is a photograph of a large painting of the Last Supper that hangs in the cathedral of Cusco, in Peru. It was painted by Marcos Zapata, a master of the Cusco School who ran a busy workshop and made hundreds of canvases for churches in Peru and Chile. The painting shows Christ's last meal with his disciples before his death, the meal Christians remember at every Mass. Zapata followed European models for the figures and the room. But the roasted animal on the platter in the middle of the table is, by long local tradition, a cuy, a guinea pig. Cuy is a feast food of the Andes, eaten on special days since long before the Inca. The painting still hangs where it was made to be seen, in the cathedral.", "look": "Find the platter in the middle of the table. The roasted animal on it is often said to be a cuy, a guinea pig. Then look up at the window behind Christ, where a night sky is full of stars. In the top left corner, find a small scene of Christ on the cross.", "medium": "Oil on canvas (photograph)", "credit": "Photo: einalem, CC BY-SA 2.0", "levels": [{"url": "crops/marcos_zapata_the_last_supper_960.jpg", "width": 960, "height": 995}, {"url": "crops/marcos_zapata_the_last_supper_1920.jpg", "width": 1920, "height": 1989}, {"url": "crops/marcos_zapata_the_last_supper_2736.jpg", "width": 2736, "height": 2835}], "wiki": "https://en.wikipedia.org/wiki/Marcos_Zapata", "commons": "https://commons.wikimedia.org/wiki/File:Catedral_-_2447324848.jpg"}, {"region": "The colonial Americas", "title": "Portrait of Sebastiana Inés Josefa de San Agustín", "artist": "Unknown painter of New Spain", "date": "1757", "location": "Museo Franz Mayer, Mexico City", "desc": "This is the portrait of a young woman from the Indigenous nobility of Santiago Tlatelolco, in New Spain, painted in 1757. The painted label beside her gives her name, her parents' names and her age, sixteen. She sat for it before she entered the convent of Corpus Christi in Mexico City, which took only daughters of the Indigenous nobility. The portrait kept her likeness for her family as she left for a life of prayer. She wears a huipil, a Native blouse of woven and embroidered cloth, together with European lace, pearls, jewels and a fan. The painter made the deep reds from cochineal, a red dye from insects raised in Mexico, mixed into oil paint. The picture shows a Native noble family claiming both its Indigenous rank and its place in the Catholic church.", "look": "Read the gold letters in the dark frame at top left: they tell you her name and that she was sixteen in 1757. Then look at her clothes: the patterned huipil with its green bands is Native dress, while the lace, the pearls in her hair and the closed fan in her hand follow European fashion.", "title_orig": "Retrato de Sebastiana Inés Josefa de San Agustín (indígena cacica)", "lang_orig": "es", "medium": "Oil on canvas", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d3/Retrato_de_Sebastiana_In%C3%A9s_Josefa_de_San_Agust%C3%ADn.jpg/960px-Retrato_de_Sebastiana_In%C3%A9s_Josefa_de_San_Agust%C3%ADn.jpg", "width": 960, "height": 1166}, {"url": "https://upload.wikimedia.org/wikipedia/commons/d/d3/Retrato_de_Sebastiana_In%C3%A9s_Josefa_de_San_Agust%C3%ADn.jpg", "width": 988, "height": 1200}], "wiki": null, "commons": "https://commons.wikimedia.org/wiki/File:Retrato_de_Sebastiana_In%C3%A9s_Josefa_de_San_Agust%C3%ADn.jpg"}, {"region": "The colonial Americas", "title": "From Spaniard and Indian, Mestizo", "artist": "Unknown painter of New Spain", "date": "1799", "location": "Biblioteca Museu Víctor Balaguer, Vilanova i la Geltrú, Spain", "desc": "This is the first picture in a set of casta paintings, a kind of painting made in Spanish America in the 1700s. Each picture in a set shows a man, a woman and their child, and a caption names the mixture of ancestry of each. Here a Spanish man and an Indigenous woman have a mestizo child. The sets ranked people by ancestry, with Spaniards at the top, and many were painted for Spanish officials and buyers who took them back to Europe. The painters made each family look calm and prosperous, but the ranking was real: under colonial rule, a person's label affected what work, schooling and rights they could have. This set came to a museum in Catalonia, Spain, and its painter is not known.", "look": "Read the words in the dark box at bottom left: they are the caption that gives this family its label. Then look at how the painter dressed each person, the father in a European hat and coat, the mother carrying the baby on her back in a shawl with a basket in her hand.", "title_orig": "De Español y India sale Mestizo", "lang_orig": "es", "medium": "Oil on canvas", "levels": [{"url": "crops/unknown_painter_of_new_spain_from_spaniard_and_indian_mestiz_960.jpg", "width": 960, "height": 718}, {"url": "crops/unknown_painter_of_new_spain_from_spaniard_and_indian_mestiz_1920.jpg", "width": 1920, "height": 1437}, {"url": "crops/unknown_painter_of_new_spain_from_spaniard_and_indian_mestiz_3074.jpg", "width": 3074, "height": 2300}], "wiki": "https://en.wikipedia.org/wiki/Casta", "commons": "https://commons.wikimedia.org/wiki/File:BMVB_-_an%C3%B2nim_-_%221_De_Espa%C3%B1ol_y_India_sale_Mestizo%22_-_1075.jpg"}, {"region": "The colonial Americas", "title": "The Twelve Prophets, Sanctuary of Bom Jesus de Matosinhos", "artist": "Aleijadinho (Antônio Francisco Lisboa) and his workshop", "date": "1800–1805", "location": "Santuário do Bom Jesus de Matosinhos, Congonhas, Minas Gerais, Brazil", "desc": "This is a photograph of three of the twelve prophets of the Old Testament carved in soapstone by Aleijadinho and his workshop for the pilgrimage church of Bom Jesus de Matosinhos in Congonhas, Brazil. The figures stand on the walls of the stairs and terrace in front of the church, so pilgrims climb up among them. Aleijadinho, born Antônio Francisco Lisboa in Minas Gerais, was the son of a Portuguese builder and Isabel, an enslaved African woman he owned. He became the leading sculptor and architect of the gold-mining towns of Minas Gerais, where lay brotherhoods grown rich in the gold boom were the main patrons of church art. In later life a disease left him badly disabled, and he became known by a nickname that refers to his disability. Each prophet holds a scroll carved with words in Latin from his book of the Bible. The church and its sculptures are a UNESCO World Heritage Site.", "look": "Find the words carved in Latin on the scroll held by the bearded prophet in front. He is Isaiah, and his scroll speaks of the seraphim, the angels he saw around God. Then follow the deep, wavy cuts of his beard and cloak. Soapstone is soft enough to carve like wood, and Aleijadinho made the folds swing and curl.", "title_orig": "Os Doze Profetas", "artist_orig": "Antônio Francisco Lisboa, o Aleijadinho", "lang_orig": "pt", "medium": "Soapstone (photograph)", "credit": "Photo: Rkieferbaum, CC BY-SA 4.0", "levels": [{"url": "crops/aleijadinho_ant_nio_francisco_lisboa_and_his_workshop_the_tw_960.jpg", "width": 960, "height": 547}, {"url": "crops/aleijadinho_ant_nio_francisco_lisboa_and_his_workshop_the_tw_1920.jpg", "width": 1920, "height": 1094}, {"url": "crops/aleijadinho_ant_nio_francisco_lisboa_and_his_workshop_the_tw_3840.jpg", "width": 3840, "height": 2189}], "wiki": "https://en.wikipedia.org/wiki/Aleijadinho", "commons": "https://commons.wikimedia.org/wiki/File:Conjunto_escult%C3%B3rico_dos_Profetas_-_Congonhas_-_Brasil_-_20260112_-_07.jpg"}, {"region": "The 1800s to about 1930", "title": "Chief Blanket (Third Phase)", "artist": "Unknown Diné (Navajo) weaver", "date": "About 1860–1865", "location": "Art Institute of Chicago", "desc": "A Diné (Navajo) woman wove this blanket on an upright loom in the 1860s, from the wool of churro sheep colored with natural dyes. In those years the US Army burned Diné homes and crops and killed their livestock, and in 1864 it forced some 8,000 Diné on the Long Walk to imprisonment in eastern New Mexico, where Diné women kept weaving. In Diné belief Spider Woman, a holy being, first taught women to weave. Blankets like this are called chief blankets, and they were among the most valued things on the Plains and in the Southwest. Prominent men of many nations, from the Northern Plains to the Great Basin, wore them over their shoulders as a sign of wealth and rank. Weavers made them wider than they were long, so the stripes ran around the wearer's body. The earliest chief blankets had only stripes. In this later style, called the third phase, the weaver added a large diamond at the center and parts of diamonds at the edges and corners. The Art Institute of Chicago bought the blanket in 2001.", "look": "Find the big red diamond in the center, then the half diamonds at the sides and top and bottom. The weaver built every sloped edge as a row of tiny steps, because she wove each color in thread by thread, row by row.", "medium": "Wool, single interlocking tapestry weave", "levels": [{"url": "crops/unknown_din_navajo_weaver_chief_blanket_third_phase_960.jpg", "width": 960, "height": 835}, {"url": "crops/unknown_din_navajo_weaver_chief_blanket_third_phase_1920.jpg", "width": 1920, "height": 1670}, {"url": "crops/unknown_din_navajo_weaver_chief_blanket_third_phase_2531.jpg", "width": 2531, "height": 2201}], "wiki": "https://en.wikipedia.org/wiki/Navajo_weaving", "commons": "https://commons.wikimedia.org/wiki/File:Chief_Blanket_(Third_Phase)_(ARTIC_2001.151).jpg"}, {"region": "The 1800s to about 1930", "title": "Dress", "artist": "Unknown Lakota beadworker", "date": "About 1870", "location": "Metropolitan Museum of Art, New York", "desc": "A Lakota woman made this dress about 1870 from tanned hide and covered its shoulders with thousands of small glass beads. The Lakota, one of the nations the United States called Sioux, lived and hunted on the northern Great Plains. Tanning hides and doing beadwork were women's arts, and a fine dress showed the skill of its maker and the standing of her family. The glass beads came by trade from Europe, and Lakota women made them their own, working them into their own designs. The beads on the yoke are sewn down in narrow rows, a method called lane stitch. A dress like this was worn for ceremonies, dances and other important days. The dress is now at the Metropolitan Museum of Art, the gift of Charles and Valerie Diker in 2019.", "look": "Look at the sky-blue yoke across the shoulders: every bit of that blue is made of tiny beads. Find the stepped zigzags in red, green and gold that run across it, then the bands of beads near the hem and the long fringes that would swing as she walked.", "medium": "Tanned leather and glass beads", "levels": [{"url": "crops/unknown_lakota_beadworker_dress_960.jpg", "width": 960, "height": 1587}, {"url": "crops/unknown_lakota_beadworker_dress_1920.jpg", "width": 1920, "height": 3174}, {"url": "crops/unknown_lakota_beadworker_dress_1960.jpg", "width": 1960, "height": 3240}], "wiki": "https://en.wikipedia.org/wiki/Lakota_people", "commons": "https://commons.wikimedia.org/wiki/File:Dress_MET_DP-15303-029.jpg"}, {"region": "The 1800s to about 1930", "title": "The Valley of Mexico from the Hill of Santa Isabel", "artist": "José María Velasco", "date": "1875", "location": "Museo Nacional de Arte (MUNAL), Mexico City", "desc": "José María Velasco painted this wide view of the Valley of Mexico from the Hill of Santa Isabel, in the hills north of Mexico City. He trained at the Academy of San Carlos in Mexico City under the Italian painter Eugenio Landesio, and he also studied botany, zoology and geology. He painted the valley again and again, and his views became a picture of the young Mexican nation. Here he shows the rocks and plants of the hillside close up, and beyond them the lakes of the valley, with the snowy volcanoes Popocatépetl and Iztaccíhuatl far off to the left. The Mexica built their capital, Tenochtitlan, on an island in these waters. Most of the lakes have since been drained. Two years later Velasco painted a larger version of this view, now also at MUNAL.", "look": "Find the two white volcano peaks far away on the left, then come back down to the rocks in front. Near the bottom, look for the small woman in a red skirt and the child beside her. They show how huge the valley is.", "title_orig": "Valle de México desde el cerro de Santa Isabel", "artist_orig": "José María Velasco", "lang_orig": "es", "medium": "Oil on canvas", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e2/Jos%C3%A9_Mar%C3%ADa_Velasco_-_The_Valley_of_Mexico_from_the_Santa_Isabel_Mountain_Range_-_Google_Art_Project.jpg/960px-Jos%C3%A9_Mar%C3%ADa_Velasco_-_The_Valley_of_Mexico_from_the_Santa_Isabel_Mountain_Range_-_Google_Art_Project.jpg", "width": 960, "height": 659}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e2/Jos%C3%A9_Mar%C3%ADa_Velasco_-_The_Valley_of_Mexico_from_the_Santa_Isabel_Mountain_Range_-_Google_Art_Project.jpg/1920px-Jos%C3%A9_Mar%C3%ADa_Velasco_-_The_Valley_of_Mexico_from_the_Santa_Isabel_Mountain_Range_-_Google_Art_Project.jpg", "width": 1920, "height": 1318}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e2/Jos%C3%A9_Mar%C3%ADa_Velasco_-_The_Valley_of_Mexico_from_the_Santa_Isabel_Mountain_Range_-_Google_Art_Project.jpg/3840px-Jos%C3%A9_Mar%C3%ADa_Velasco_-_The_Valley_of_Mexico_from_the_Santa_Isabel_Mountain_Range_-_Google_Art_Project.jpg", "width": 3840, "height": 2637}], "wiki": "https://en.wikipedia.org/wiki/Jos%C3%A9_Mar%C3%ADa_Velasco_G%C3%B3mez", "commons": "https://commons.wikimedia.org/wiki/File:Jos%C3%A9_Mar%C3%ADa_Velasco_-_The_Valley_of_Mexico_from_the_Santa_Isabel_Mountain_Range_-_Google_Art_Project.jpg"}, {"region": "The 1800s to about 1930", "title": "The Death of Cleopatra", "artist": "Edmonia Lewis", "date": "1876", "location": "Smithsonian American Art Museum, Washington, DC", "desc": "Edmonia Lewis carved this marble in her studio in Rome. It stands 63 inches (160 cm) tall. Lewis was of African American and Ojibwe (Mississauga) descent, and she was the first sculptor of that background to win fame in the United States and Europe. She shows Cleopatra, the last queen of Egypt, just after she has died from the bite of a snake. Lewis showed the queen already dead, seated on her throne with her head fallen back. Some critics in 1876 found this too real and called it \"ghastly.\" The statue weighs almost 3,000 pounds and was shown at the Centennial Exhibition in Philadelphia in 1876. Afterward it was lost for about a century: a gambler set it over the grave of a racehorse named Cleopatra near Chicago. It turned up in a salvage yard in the 1980s, and the Historical Society of Forest Park, Illinois, gave it to the Smithsonian in 1994.", "look": "Look at the queen's closed eyes and her head tipped back: she has just died. Then find the Egyptian crown on her head and the two carved sphinx heads on the arms of the throne, one on each side. The museum says they stand for the twins she had with the Roman general Mark Antony.", "medium": "Marble", "credit": "Photo: Mark Landon, CC BY 4.0", "levels": [{"url": "crops/edmonia_lewis_the_death_of_cleopatra_960.jpg", "width": 960, "height": 1873}, {"url": "crops/edmonia_lewis_the_death_of_cleopatra_1920.jpg", "width": 1920, "height": 3746}, {"url": "crops/edmonia_lewis_the_death_of_cleopatra_2460.jpg", "width": 2460, "height": 4800}], "wiki": "https://en.wikipedia.org/wiki/The_Death_of_Cleopatra_%28Edmonia_Lewis%29", "commons": "https://commons.wikimedia.org/wiki/File:Death_of_Cleopatra_-_Edmonia_Lewis_(SAAM_1994.17)_01.jpg"}, {"region": "The 1800s to about 1930", "title": "Drawing from a Fort Marion sketchbook", "artist": "Etahdleuh Doanmoe (Kiowa)", "date": "1877 or earlier", "location": "Etnografiska museet, Stockholm", "desc": "Etahdleuh Doanmoe was a young Kiowa man, born in 1856, who made this drawing as a prisoner of the United States Army. In 1875, after the wars on the Southern Plains, the army sent him and dozens of other Kiowa, Cheyenne, Comanche, Arapaho and Caddo men to Fort Marion, an old Spanish fort in St. Augustine, Florida. There the prisoners were given paper and colored pencils, and many sold their drawings to visitors. Plains men had long painted their deeds on hides and tipis, and on paper this kind of work is called ledger art. Far from home, Etahdleuh drew riders, animals, and people in their finest dress. This booklet of fifteen drawings was bought at Fort Marion on January 2, 1877, through another prisoner, Ak-eah. It belonged to Josua Lindahl, a Swedish scientist working in the United States. It was shown in Stockholm in 1878–79 and entered the museum in 1900.", "look": "Find the three standing figures wrapped in long robes, each holding a fan of feathers up by the face. Then find the two riders sharing one gray horse. See how the artist filled the robes and leggings with blocks of red, blue and yellow, stripes, and small diamonds.", "medium": "Pencil and colored pencil on paper", "levels": [{"url": "crops/etahdleuh_doanmoe_kiowa_drawing_from_a_fort_marion_sketchboo_960.jpg", "width": 960, "height": 709}, {"url": "crops/etahdleuh_doanmoe_kiowa_drawing_from_a_fort_marion_sketchboo_1920.jpg", "width": 1920, "height": 1417}, {"url": "crops/etahdleuh_doanmoe_kiowa_drawing_from_a_fort_marion_sketchboo_2945.jpg", "width": 2945, "height": 2174}], "wiki": "https://en.wikipedia.org/wiki/Ledger_art", "commons": "https://commons.wikimedia.org/wiki/File:Ledger_drawing,_1900.32.0254_09.tif"}, {"region": "The 1800s to about 1930", "title": "Chilkat robe", "artist": "Mary Ebbetts Hunt (Anislaga), Tlingit", "date": "Late 1800s to early 1900s", "location": "Honolulu Museum of Art, Honolulu", "desc": "This Chilkat robe was woven by Mary Ebbetts Hunt (1823–1919), whose Tlingit name was Anislaga. She was a Tongass Tlingit woman of the Raven clan from southeast Alaska. She married Robert Hunt, an Englishman who worked for the Hudson's Bay Company, and lived at Fort Rupert on Vancouver Island, a Kwakwaka'wakw town. Many consider her the finest Tlingit weaver of Chilkat robes. Chilkat robes were woven by women, following a design that a man painted on a wooden pattern board. The weaver twined the wool by hand in vertical sections, shaping curves and circles inside the weave, and a robe could take a year to make. A robe like this was worn over the shoulders to dance at feasts and potlatches, the great gatherings where names, rank and rights were shown and gifts given. The long fringe swung as the dancer moved; the Tlingit name for the robe, naaxein, means \"fringe around the body.\" The main figure is a raven, her clan's crest. The museum bought the robe in 1935, and her family later confirmed it as her work.", "look": "Find the two big eyes near the top: they belong to a large raven seen from the front. A smaller raven face sits below it, at the bottom center. Each eye sits inside an ovoid, the rounded box shape of Northwest Coast formline. The weaver made the left side a mirror of the right: find the faces with bared teeth on each side.", "medium": "Mountain goat wool, twined (twill tapestry twining)", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8b/Chilkat_robe_by_Mary_Ebbetts_Hunt_%28Anisalaga%29%2C_Tlingit_people%2C_Honolulu_Museum_of_Art%2C_4183.JPG/960px-Chilkat_robe_by_Mary_Ebbetts_Hunt_%28Anisalaga%29%2C_Tlingit_people%2C_Honolulu_Museum_of_Art%2C_4183.JPG", "width": 960, "height": 695}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8b/Chilkat_robe_by_Mary_Ebbetts_Hunt_%28Anisalaga%29%2C_Tlingit_people%2C_Honolulu_Museum_of_Art%2C_4183.JPG/1920px-Chilkat_robe_by_Mary_Ebbetts_Hunt_%28Anisalaga%29%2C_Tlingit_people%2C_Honolulu_Museum_of_Art%2C_4183.JPG", "width": 1920, "height": 1390}, {"url": "https://upload.wikimedia.org/wikipedia/commons/8/8b/Chilkat_robe_by_Mary_Ebbetts_Hunt_%28Anisalaga%29%2C_Tlingit_people%2C_Honolulu_Museum_of_Art%2C_4183.JPG", "width": 3372, "height": 2442}], "wiki": "https://en.wikipedia.org/wiki/Chilkat_weaving", "commons": "https://commons.wikimedia.org/wiki/File:Chilkat_robe_by_Mary_Ebbetts_Hunt_(Anisalaga),_Tlingit_people,_Honolulu_Museum_of_Art,_4183.JPG"}, {"region": "The 1800s to about 1930", "title": "Totem Pole Model", "artist": "Charles Edenshaw, Haida", "date": "About 1890", "location": "Metropolitan Museum of Art, New York", "desc": "This small pole, about 41 centimeters tall, was carved by Charles Edenshaw, one of the most admired Haida artists of his time. Edenshaw came from Haida Gwaii, the islands off the northern coast of British Columbia. He carved wood, silver, gold and argillite, and he painted designs on the hats and baskets woven by his wife, Isabella Edenshaw. Argillite is a soft black stone that the Haida quarry on Haida Gwaii, and it turns glossy when polished. From the 1800s Haida carvers made argillite poles, plates and pipes to sell to traders, sailors and collectors. Full-size poles of cedar stood in front of Haida houses and told the crests and histories of the families inside. A model like this one carried that art to buyers far away, at a time when missionaries and Canadian law were pressing Haida people to give up their ceremonies. It came to the Met in 2011 with the Ralph T. Coe Collection.", "look": "Start at the big face at the bottom and climb up. Find the three small figures sitting one above another, each in a tall hat, beside a column marked with rings. At the very top, an animal crouches with its head bent down.", "artist_orig": "Da.axiigang", "lang_orig": "hai", "medium": "Argillite", "levels": [{"url": "crops/charles_edenshaw_haida_totem_pole_model_960.jpg", "width": 960, "height": 2967}, {"url": "crops/charles_edenshaw_haida_totem_pole_model_1100.jpg", "width": 1100, "height": 3400}], "wiki": "https://en.wikipedia.org/wiki/Charles_Edenshaw", "commons": "https://commons.wikimedia.org/wiki/File:Totem_Pole_Model_MET_DP279553.jpg"}, {"region": "The 1800s to about 1930", "title": "The Wake", "artist": "Francisco Oller", "date": "1893", "location": "Museo de Historia, Antropología y Arte, Universidad de Puerto Rico, Río Piedras", "desc": "Francisco Oller was a Puerto Rican painter who worked in Madrid and Paris and knew the French Impressionists, among them Camille Pissarro, who was born in the Caribbean, and Paul Cézanne. Back in Puerto Rico he painted the everyday life of the island. This huge canvas shows a baquiné, a wake for a young child held in a country house. The custom joins African and Spanish traditions with the Catholic belief that a baptized child who dies goes straight to heaven, so the wake was a feast with music, food and drink. Oller began it in 1891 at the Hacienda Santa Bárbara, an estate in Carolina, using farm workers, friends and family as models. Puerto Rico was then a Spanish colony, and the painting was first shown in San Juan at the 1893 exhibition marking four hundred years of Spanish rule. Oller called the scene \"an orgy of brutish appetites under the guise of gross superstition,\" and it was shown at the Paris Salon in 1895. It is now counted among the great treasures of Puerto Rican art.", "look": "Find the seated man on the left strumming a small guitar-like instrument, and the dogs running across the floor. Then find the young man lifting a roast pig high on a long pole, and the priest in black on the right who turns to stare at it. Oller packed the room with people who are all doing something different.", "title_orig": "El velorio", "artist_orig": "Francisco Oller y Cestero", "lang_orig": "es", "medium": "Oil on canvas", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/67/El_Velorio_by_Francisco_Oller.jpg/960px-El_Velorio_by_Francisco_Oller.jpg", "width": 960, "height": 575}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/67/El_Velorio_by_Francisco_Oller.jpg/1920px-El_Velorio_by_Francisco_Oller.jpg", "width": 1920, "height": 1150}, {"url": "https://upload.wikimedia.org/wikipedia/commons/6/67/El_Velorio_by_Francisco_Oller.jpg", "width": 3135, "height": 1878}], "wiki": "https://en.wikipedia.org/wiki/El_Velorio", "commons": "https://commons.wikimedia.org/wiki/File:El_Velorio_by_Francisco_Oller.jpg"}, {"region": "The 1800s to about 1930", "title": "The Young Sabot Maker", "artist": "Henry Ossawa Tanner", "date": "1895", "location": "Nelson-Atkins Museum of Art, Kansas City", "desc": "Henry Ossawa Tanner was born in Pittsburgh, the son of a bishop of the African Methodist Episcopal Church, and studied in Philadelphia with the painter Thomas Eakins. In 1891 he moved to Paris, where he met less racial prejudice than in the United States, and he became the first African American painter to win fame abroad. He spent summers in Brittany, in western France. Here a boy carves a sabot, the wooden shoe of Brittany, while an older man, likely his father, watches while working on a shoe of his own. Tanner painted this theme of an elder teaching a child more than once, as in his famous painting The Banjo Lesson. The picture honors skilled handwork and the knowledge passed from one generation to the next. It was accepted for the Paris Salon of 1895. Tanner gave it to his parents, and the museum bought it in 1995.", "look": "Follow the boy's arms to the long tool he is pushing with all his weight, then find the pale wooden shoe it is carving. Look at the old man's face as he watches, and at the finished shoes and wood shavings scattered all over the floor.", "medium": "Oil on canvas", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/35/Henry_Ossawa_Tanner_-_The_Young_Sabot_Maker_-_Google_Art_Project.jpg/960px-Henry_Ossawa_Tanner_-_The_Young_Sabot_Maker_-_Google_Art_Project.jpg", "width": 960, "height": 1295}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/35/Henry_Ossawa_Tanner_-_The_Young_Sabot_Maker_-_Google_Art_Project.jpg/1920px-Henry_Ossawa_Tanner_-_The_Young_Sabot_Maker_-_Google_Art_Project.jpg", "width": 1920, "height": 2590}, {"url": "https://upload.wikimedia.org/wikipedia/commons/3/35/Henry_Ossawa_Tanner_-_The_Young_Sabot_Maker_-_Google_Art_Project.jpg", "width": 2966, "height": 4001}], "wiki": "https://en.wikipedia.org/wiki/The_Young_Sabot_Maker", "commons": "https://commons.wikimedia.org/wiki/File:Henry_Ossawa_Tanner_-_The_Young_Sabot_Maker_-_Google_Art_Project.jpg"}, {"region": "The 1800s to about 1930", "title": "Crooked Beak mask and Huxwhukw mask", "artist": "Yakuglas (Charlie James), Kwakwaka'wakw", "date": "About 1900", "location": "Portland Art Museum, Portland, Oregon", "desc": "These two masks were carved by Yakuglas, also known as Charlie James, a Kwakwaka'wakw master carver who worked at Alert Bay on the coast of British Columbia. Crooked Beak and Huxwhukw are giant supernatural birds in the dances of the Hamat'sa, the highest-ranking Kwakwaka'wakw dance society. Dancers wore the masks on the forehead, with long fringes of shredded cedar bark hiding their faces, and pulled strings to make the beaks snap open and shut. The right to show such masks was passed down in families and displayed at potlatches, feasts where hosts gave away goods to make their names and rank known. From 1885 to 1951 Canadian law banned the potlatch. After Chief Dan Cranmer held a great potlatch at Village Island in 1921, dozens of people were charged and some were jailed. In 1922 officials took their masks and regalia and sent most of them to museums in Ottawa and Toronto, and some were sold to a collector in New York. Much of that seized regalia has since been returned to the Kwakwaka'wakw and is kept at the U'mista Cultural Centre at Alert Bay and the Nuyumbalees Cultural Centre at Cape Mudge. Yakuglas taught younger carvers, among them his stepson Mungo Martin, who helped keep the art alive through the years of the ban. The Portland Art Museum bought these masks as part of the Rasmussen Collection of Northwest Coast art.", "look": "Find the two birds' eyes, each set in a white shape with a black ring around it. Then compare the beaks: one is short, under a big curved arch, and the other is long and straight like a spear. Look for the shaggy cedar bark that hung down to hide the dancer's face.", "medium": "Red cedar, red cedar bark, feathers, paint, string", "levels": [{"url": "crops/yakuglas_charlie_james_kwakwaka_wakw_crooked_beak_mask_and_h_960.jpg", "width": 960, "height": 692}, {"url": "crops/yakuglas_charlie_james_kwakwaka_wakw_crooked_beak_mask_and_h_1920.jpg", "width": 1920, "height": 1383}, {"url": "crops/yakuglas_charlie_james_kwakwaka_wakw_crooked_beak_mask_and_h_3840.jpg", "width": 3840, "height": 2767}], "wiki": "https://en.wikipedia.org/wiki/Potlatch_ban", "commons": "https://commons.wikimedia.org/wiki/File:Crooked_beak_mask_and_Huxwhukw_mask,_by_Yakuglas_Charlie_James_(1875-1938),_Kwakwka%27wakw,_c._1900,_red_cedar,_red_cedar_bark,_feathers,_paint,_string_-_Portland_Art_Museum_-_Portland,_Oregon_-_DSC09113.jpg"}, {"region": "The 1800s to about 1930", "title": "The Offering", "artist": "Saturnino Herrán", "date": "1913", "location": "Museo Nacional de Arte (MUNAL), Mexico City", "desc": "Saturnino Herrán painted this canvas in 1913, during the Mexican Revolution. He was one of the first painters of his time to make Mexico's Indigenous and working people the heroes of large, serious pictures. An Indigenous family glides along a canal in a flat boat, loaded with cempasúchil, the orange marigolds that Mexicans place on the ofrenda, the home altar for the dead, on the Day of the Dead. The people on board range from a baby to a young man to an old man, so the boat carries every stage of life toward the same end. The flowers, the boat and the canals go back to the Nahua world of the Valley of Mexico. Herrán died in 1918, aged 31. The Mexican government bought the painting from his widow after his death.", "look": "Find the three ages on the boat: the sleeping baby wrapped in the woman's shawl, the young man in white carrying marigolds on his shoulder, and the gray-bearded old man in the big hat behind him, a pole on his shoulder, gazing far away. Then see how the bright orange flowers glow against the dark boat and the pale water.", "title_orig": "La ofrenda", "artist_orig": "Saturnino Herrán", "lang_orig": "es", "medium": "Oil on canvas", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/df/Saturnino_Herr%C3%A1n_-_The_offering_-_Google_Art_Project.jpg/960px-Saturnino_Herr%C3%A1n_-_The_offering_-_Google_Art_Project.jpg", "width": 960, "height": 849}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/df/Saturnino_Herr%C3%A1n_-_The_offering_-_Google_Art_Project.jpg/1920px-Saturnino_Herr%C3%A1n_-_The_offering_-_Google_Art_Project.jpg", "width": 1920, "height": 1698}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/df/Saturnino_Herr%C3%A1n_-_The_offering_-_Google_Art_Project.jpg/3840px-Saturnino_Herr%C3%A1n_-_The_offering_-_Google_Art_Project.jpg", "width": 3840, "height": 3397}], "wiki": "https://en.wikipedia.org/wiki/Saturnino_Herr%C3%A1n", "commons": "https://commons.wikimedia.org/wiki/File:Saturnino_Herr%C3%A1n_-_The_offering_-_Google_Art_Project.jpg"}];
const grid = document.getElementById('grid');
const viewerEl = document.getElementById('viewer');
const info = document.getElementById('info');
const loading = document.getElementById('loading');
let filter = 'all', current = -1, osd = null;

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

DATA.forEach((p, i) => {
  const t = p.card || p.levels[0];
  const b = document.createElement('button');
  b.className = 'card';
  b.dataset.region = p.region;
  b.style.setProperty('--ar', (t.width / t.height).toFixed(3));
  b.innerHTML = `<div class="frame"><img src="${t.url}" width="${t.width}" height="${t.height}" loading="lazy" alt="${esc(p.title)}, ${esc(p.artist)}"><span class="num">${i + 1}</span></div>
    <h2>${esc(p.title)}</h2><p>${esc(p.artist)} · ${esc(p.date)}</p>`;
  b.addEventListener('click', () => open(i));
  grid.appendChild(b);
});

document.querySelectorAll('.filters button').forEach(btn => btn.addEventListener('click', () => {
  filter = btn.dataset.f;
  document.querySelectorAll('.filters button').forEach(x => x.setAttribute('aria-pressed', x === btn));
  grid.querySelectorAll('.card').forEach(c => c.hidden = filter !== 'all' && c.dataset.region !== filter);
}));

const visible = () => DATA.map((p, i) => i).filter(i => filter === 'all' || DATA[i].region === filter);

function ensureViewer() {
  if (osd) return;
  osd = OpenSeadragon({
    element: document.getElementById('osd'),
    drawer: 'canvas',  // WebGL refuses images loaded from file:// and Wikimedia
    showNavigationControl: false,
    showNavigator: true,
    navigatorPosition: 'BOTTOM_LEFT',
    navigatorBackground: '#0a0908',
    maxZoomPixelRatio: 1,
    visibilityRatio: 0.6,
    animationTime: 0.7,
    gestureSettingsMouse: { clickToZoom: false, dblClickToZoom: true },
  });
  osd.addHandler('tile-loaded', () => loading.style.display = 'none');
  osd.addHandler('open', () => { if (DATA[current] && DATA[current].wide) scrollHome(true); });
  // Wide works: the wheel and trackpad move along the scroll instead of zooming.
  // Handled before OpenSeadragon sees the event, since it drops rapid wheel events.
  document.getElementById('osd').addEventListener('wheel', ev => {
    const p = DATA[current];
    if (!p || !p.wide) return;
    ev.preventDefault();
    ev.stopPropagation();
    const scale = ev.deltaMode === 1 ? 40 : 1;
    if (ev.ctrlKey) {  // trackpad pinch (and ctrl+wheel) zooms at the pointer
      const r = ev.currentTarget.getBoundingClientRect();
      const at = osd.viewport.pointFromPixel(new OpenSeadragon.Point(ev.clientX - r.left, ev.clientY - r.top));
      osd.viewport.zoomBy(Math.exp(-ev.deltaY * scale / 100), at, true);
    } else {
      const dx = Math.abs(ev.deltaX) > Math.abs(ev.deltaY) ? ev.deltaX : (p.handscroll ? -ev.deltaY : ev.deltaY);
      osd.viewport.panBy(osd.viewport.deltaPointsFromPixels(new OpenSeadragon.Point(dx * scale, 0)), true);
    }
    osd.viewport.applyConstraints(true);
  }, { capture: true, passive: false });
  osd.addHandler('open-failed', () => loading.textContent = 'Image failed to load');
  osd.addHandler('canvas-key', e => {
    if (['ArrowLeft', 'ArrowRight', 'Escape', 'f', 'F', 'i', 'I'].includes(e.originalEvent.key)) e.preventDefaultAction = true;
  });
}

// Wide works open at full height, at the end the reader starts from (right end for a handscroll)
function scrollHome(immediately) {
  const vp = osd.viewport;
  vp.fitVertically(true);
  const b = vp.getBounds(true);
  const w = osd.world.getItemAt(0).getContentSize();
  const width = 1, height = w.y / w.x;
  const x = DATA[current].handscroll ? width - b.width / 2 : b.width / 2;
  vp.panTo(new OpenSeadragon.Point(Math.max(b.width / 2, x), height / 2), immediately);
}
function scrollStep(dir) {  // dir -1 = toward the left edge
  const b = osd.viewport.getBounds();
  osd.viewport.panBy(new OpenSeadragon.Point(dir * b.width * 0.8, 0));
}

function open(i, push = true) {
  current = i;
  const p = DATA[i];
  viewerEl.classList.add('open');
  document.body.style.overflow = 'hidden';
  ensureViewer();
  loading.textContent = 'Loading…';
  loading.style.display = 'block';
  osd.open(p.dzi || { type: 'legacy-image-pyramid', levels: p.levels });
  info.innerHTML = `
    <p class="count">${i + 1} of ${DATA.length} · ${p.region}</p>
    <h2>${esc(p.title)}</h2>${p.title_zh ? `<p class="zh" lang="zh">${esc(p.title_zh)}</p>` : ''}${p.title_ja ? `<p class="ja" lang="ja">${esc(p.title_ja)}</p>` : ''}${p.title_ko ? `<p class="ko" lang="ko">${esc(p.title_ko)}</p>` : ''}${p.title_orig ? `<p class="orig ${p.lang_orig}" lang="${p.lang_orig}" dir="${['ar', 'fa', 'ur'].includes(p.lang_orig) ? 'rtl' : 'ltr'}">${esc(p.title_orig)}</p>` : ''}
    <p class="artist">${esc(p.artist)}${p.artist_zh ? ` <span class="zh" lang="zh">${esc(p.artist_zh)}</span>` : ''}${p.artist_ja ? ` <span class="ja" lang="ja">${esc(p.artist_ja)}</span>` : ''}${p.artist_ko ? ` <span class="ko" lang="ko">${esc(p.artist_ko)}</span>` : ''}${p.artist_orig ? ` <span class="orig ${p.lang_orig}" lang="${p.lang_orig}" dir="${['ar', 'fa', 'ur'].includes(p.lang_orig) ? 'rtl' : 'ltr'}">${esc(p.artist_orig)}</span>` : ''}</p>
    <p class="meta">${esc(p.date)}${p.medium ? '<br>' + esc(p.medium) : ''}<br>${esc(p.location)}</p>
    ${p.wide ? `<p class="scrollnote">${p.handscroll ? 'A handscroll, read from right to left. Scroll or swipe to unroll it.' : 'A long work. Scroll or swipe to move along it.'}</p>` : ''}
    <p class="desc">${esc(p.desc)}</p>
    <div class="look"><b>Look for</b>${esc(p.look)}</div>
    <div class="links">
      ${p.wiki ? `<a href="${p.wiki}" target="_blank" rel="noopener">Read more on Wikipedia</a>` : ''}
      <a href="${p.commons}" target="_blank" rel="noopener">${p.credit ? 'Image source' : 'Full-resolution original'}</a>
    </div>${p.credit ? `<p class="credit">Image: ${esc(p.credit)}</p>` : ''}
    <p class="hint">${p.wide ? 'Scroll, swipe or drag to move along the work, pinch or +/− to zoom, ⤢ goes back to the start. Arrow keys move along it; the ‹ › buttons switch works.' : 'Scroll or pinch to zoom, drag to move, double-click to zoom in. Arrow keys switch paintings.'} I hides this panel, F goes full screen, Esc closes.</p>`;
  info.scrollTop = 0;
  if (push) history.pushState({ i }, '', '#' + (i + 1));
}

function close(push = true) {
  if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  viewerEl.classList.remove('open');
  document.body.style.overflow = '';
  if (osd) osd.close();
  current = -1;
  if (push) history.pushState({}, '', location.pathname);
}

function step(d) {
  const v = visible();
  let k = v.indexOf(current);
  k = k === -1 ? 0 : (k + d + v.length) % v.length;
  open(v[k]);
}

document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.getElementById('close').onclick = () => close();
document.getElementById('zin').onclick = () => osd.viewport.zoomBy(1.6);
document.getElementById('zout').onclick = () => osd.viewport.zoomBy(1 / 1.6);
document.getElementById('home').onclick = () => DATA[current].wide ? scrollHome(false) : osd.viewport.goHome();

let panelHidden = false;
try { panelHidden = localStorage.getItem('panelHidden') === '1'; } catch (e) {}
const panelBtn = document.getElementById('panel');
const isFull = () => document.fullscreenElement || document.webkitFullscreenElement;

function applyBare() {
  const bare = panelHidden || !!isFull();
  viewerEl.classList.toggle('bare', bare);
  panelBtn.setAttribute('aria-pressed', !bare);
}
function togglePanel() {
  if (isFull()) return toggleFull();
  panelHidden = !panelHidden;
  try { localStorage.setItem('panelHidden', panelHidden ? '1' : '0'); } catch (e) {}
  applyBare();
}
function toggleFull() {
  if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (viewerEl.requestFullscreen || viewerEl.webkitRequestFullscreen).call(viewerEl);
}
panelBtn.onclick = togglePanel;
document.getElementById('fs').onclick = toggleFull;
document.addEventListener('fullscreenchange', applyBare);
document.addEventListener('webkitfullscreenchange', applyBare);
applyBare();

// Controls fade out after 2.5 s without mouse movement, so only the painting shows
let idleTimer;
function wake() {
  viewerEl.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => viewerEl.classList.add('idle'), 2500);
}
viewerEl.addEventListener('mousemove', wake);
viewerEl.addEventListener('touchstart', wake, { passive: true });

document.addEventListener('keydown', e => {
  if (current < 0) return;
  if (e.key === 'Escape') { if (!isFull()) close(); }
  else if (e.key === 'ArrowRight') DATA[current].wide ? scrollStep(1) : step(1);
  else if (e.key === 'ArrowLeft') DATA[current].wide ? scrollStep(-1) : step(-1);
  else if (e.key === 'i' || e.key === 'I') togglePanel();
  else if (e.key === 'f' || e.key === 'F') toggleFull();
  else return;
  wake();
});

function fromHash() {
  const n = parseInt(location.hash.slice(1), 10);
  if (n >= 1 && n <= DATA.length) open(n - 1, false);
  else if (current >= 0) close(false);
}
window.addEventListener('popstate', fromHash);
fromHash();
</script>
</body>
</html>
